<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 섭리 명곡 맞추기</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        /* 왼쪽 상단 나가기 버튼 */
        .exit-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: none;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            padding: 6px;
            border-radius: 10px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .exit-btn:hover {
            background: #f1f5f9;
        }

        .exit-btn svg {
            width: 24px;
            height: 24px;
            fill: #64748b;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* 시작 화면 */
        .start-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
        }

        select {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
            text-align: right;
        }

        /* 게임 화면 */
        .status-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .status-item .label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .status-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            transition: color 0.3s ease; /* 색상 변경 시 부드럽게 */
        }

        .player-card {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-sub);
            font-size: 14px;
        }

        input[type="range"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .hint-box {
            background: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            display: none;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .notice {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        /* 토스트 알림창 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            z-index: 100;
            display: none;
            width: 80%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            word-break: keep-all;
        }

        /* 결과 & 랭킹 화면 */
        .result-card, .rank-card {
            text-align: center;
            padding: 20px 0;
        }

        .result-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .score-display {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 24px;
        }

        .rank-list {
            list-style: none;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
        }

        .rank-list li {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        .rank-list li:last-child { border-bottom: none; }

        /* 공통 버튼 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-full { width: 100%; padding: 16px; font-size: 16px; }
        .btn-sub { background: #e2e8f0; color: var(--text-main); }
        .btn-sub:hover { background: #cbd5e1; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { filter: brightness(0.9); }
        .btn-success { background: var(--success); color: white; }

        /* 버전 표시 */
        .footer-version {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
    <!-- Firebase SDK 불러오기 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

</head>

<div class="container">
    <div class="header">
        <h1>🎵 섭리 명곡 맞추기</h1>
    </div>

    <!-- 1. 게임 시작 화면 -->
    <div id="startScreen" class="screen active">
        <div class="start-group">
            <div class="select-wrapper">
                <span>게임 모드</span>
                <select id="modeSelect">
                    <option value="normal">일반 모드 (처음부터)</option>
                    <option value="special">Special 모드 (중간부터)</option>
                </select>
            </div>
            <div class="select-wrapper">
                <span>타이머 설정</span>
                <select id="timeSelect">
                    <option value="60">1분</option>
                    <option value="180">3분</option>
                    <option value="300">5분</option>
                    <option value="600">10분</option>
                    <option value="unlimited">무제한 모드</option>
                </select>
            </div>
            <button class="btn btn-full" id="startBtn">🎮 게임 시작</button>
            <button class="btn btn-full btn-sub" id="viewRankBtn">🏆 순위표 보기</button>
        </div>
    </div>

    <!-- 2. 게임 진행 화면 -->
    <div id="gameScreen" class="screen">
        <!-- 나가기 버튼 -->
        <button id="exitGameBtn" class="exit-btn" title="게임 나가기">
            <svg viewBox="0 0 24 24">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </button>

        <div class="status-board">
            <div class="status-item">
                <span class="label">⏱️ 남은 시간</span>
                <span class="value" id="timer">01:00</span>
            </div>
            <div class="status-item">
                <span class="label">🎯 맞춘 개수</span>
                <span class="value" id="score">0개</span>
            </div>
        </div>

        <div class="player-card">
            <div class="controls-row">
                <button class="btn btn-sub" id="pauseBtn">▶️ 재생 (5초)</button>
                <button class="btn" id="play30Btn">▶️ 30초 듣기</button>
            </div>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 16px;">
            <button class="btn btn-warning" id="hintBtn">💡 초성 힌트 보기</button>
        </div>
        <div class="hint-box" id="hintBox"></div>

        <div class="input-group">
            <input type="text" id="answerInput" placeholder="정답 입력 (빈칸 시 엔터 2번 = 패스)" autocomplete="off">
            <button class="btn" id="submitBtn">확인</button>
        </div>
        <p class="notice">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다.</p>
        
        <!-- 오디오 (효과음 & 음악) -->
        <audio id="audioPlayer"></audio>
        <!-- 효과음 파일명이 소문자(.mp3)인지 대문자(.MP3)인지 꼭 확인 후 맞춰주세요! -->
        <audio id="sfxCorrect" src="correct.mp3"></audio>
        <audio id="sfxWrong" src="wrong.mp3"></audio>

        <!-- 알림창 (Toast) -->
        <div id="toastMessage" class="toast">정답 알림창</div>
    </div>

    <!-- 3. 게임 종료 화면 -->
    <div id="resultScreen" class="screen">
        <div class="result-card">
            <div class="result-title">게임 종료!</div>
            <div class="score-display" id="finalScore">0개</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                <button class="btn btn-success" id="saveRankBtn">💾 기록 저장하기</button>
                <button class="btn btn-sub" id="restartBtn">🏠 처음으로</button>
            </div>
        </div>
    </div>

    <!-- 4. 순위표 화면 -->
    <div id="rankScreen" class="screen">
        <div class="rank-card">
            <div class="result-title">🏆 명예의 전당</div>
            <p class="notice">※ 실시간 전국 랭킹 기록입니다.</p>
            <ul class="rank-list" id="rankList">
                <!-- JS에서 채워짐 -->
            </ul>
            <button class="btn btn-full btn-sub" id="backToStartBtn">🏠 뒤로 가기</button>
        </div>
    </div>
</div>

        let shuffledList = [];
        let currentIndex = 0;
        let score = 0;
        let timer = null;
        let totalTime = 60;
        let timeLeft = 60;
        let emptyEnterCount = 0;
        let wrongAttempts = 0;
        let isUnlimited = false;
        let currentMode = 'normal';
        let maxPlaySeconds = 5; 
        let startPlayTime = 0; 

        // DOM Elements
        const screens = document.querySelectorAll('.screen');
        const modeSelect = document.getElementById('modeSelect');
        const timeSelect = document.getElementById('timeSelect');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const audioPlayer = document.getElementById('audioPlayer');
        const sfxCorrect = document.getElementById('sfxCorrect');
        const sfxWrong = document.getElementById('sfxWrong');
        const answerInput = document.getElementById('answerInput');
        const hintBox = document.getElementById('hintBox');
        const toastMessage = document.getElementById('toastMessage');

        // 셔플 함수 (Fisher-Yates 알고리즘)
        function shuffle(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 화면 전환
        function showScreen(screenId) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 토스트 메시지
        function showToast(msg, duration = 2000, callback = null) {
            toastMessage.textContent = msg;
            toastMessage.style.display = 'block';
            
            answerInput.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            setTimeout(() => {
                toastMessage.style.display = 'none';
                answerInput.disabled = false;
                document.getElementById('submitBtn').disabled = false;
                answerInput.focus();
                if (callback) callback();
            }, duration);
        }

        // 초성 추출 함수
        function getChosung(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
                else result += str.charAt(i); 
            }
            return result;
        }

        // 점수 업데이트
        function updateScoreDisplay() {
            if (isUnlimited) {
                scoreEl.textContent = `${score} / ${shuffledList.length}개`;
            } else {
                scoreEl.textContent = `${score}개`;
            }
        }

        // 게임 시작
        document.getElementById('startBtn').addEventListener('click', () => {
            currentMode = modeSelect.value;
            const selectedTime = timeSelect.value;
            
            isUnlimited = (selectedTime === 'unlimited');
            totalTime = isUnlimited ? 0 : parseInt(selectedTime);
            timeLeft = totalTime;
            
            timerEl.style.color = "var(--text-main)";
            
            score = 0;
            currentIndex = 0;
            shuffledList = shuffle([...playlist]);
            updateScoreDisplay();
            
            if (isUnlimited) {
                timerEl.textContent = "무제한";
            } else {
                updateTimerDisplay();
                clearInterval(timer);
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) endGame();
                }, 1000);
            }
            
            showScreen('gameScreen');
            nextQuestion();
        });

        // 타이머 업데이트 및 10% 이하 시 빨간색 표시
        function updateTimerDisplay() {
            if (isUnlimited) return;
            
            if (totalTime > 0 && timeLeft <= (totalTime * 0.1)) {
                timerEl.style.color = "var(--danger)";
            } else {
                timerEl.style.color = "var(--text-main)";
            }

            const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const sec = String(timeLeft % 60).padStart(2, '0');
            timerEl.textContent = `${min}:${sec}`;
        }

        // 문제 로드
        function nextQuestion() {
            if (currentIndex >= shuffledList.length) {
                endGame();
                return;
            }
            hintBox.style.display = 'none';
            answerInput.value = '';
            answerInput.placeholder = '정답 입력 (빈칸 시 엔터 2번 = 패스)';
            emptyEnterCount = 0;
            wrongAttempts = 0; 
            
            const currentSong = shuffledList[currentIndex];
            audioPlayer.src = currentSong.src;
            audioPlayer.volume = document.getElementById('volumeSlider').value;
            
            audioPlayer.load();
            audioPlayer.onloadedmetadata = () => {
                playAudioLimit(5); 
            };
        }

        // 오디오 재생 제한 제어
        function playAudioLimit(seconds) {
            maxPlaySeconds = seconds;
            
            if (currentMode === 'special' && audioPlayer.duration) {
                startPlayTime = audioPlayer.duration / 2;
            } else {
                startPlayTime = 0;
            }
            
            audioPlayer.currentTime = startPlayTime;
            audioPlayer.play().catch(e => console.log('Auto play blocked'));
            document.getElementById('pauseBtn').textContent = '⏸️ 일시정지';
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.currentTime >= startPlayTime + maxPlaySeconds && !audioPlayer.paused) {
                audioPlayer.pause();
                document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
            }
        });

        // 오디오 버튼 제어
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (audioPlayer.paused) {
                playAudioLimit(5);
            } else {
                audioPlayer.pause();
                document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
            }
        });

        document.getElementById('play30Btn').addEventListener('click', () => {
            playAudioLimit(30);
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });

        // 힌트 보기
        document.getElementById('hintBtn').addEventListener('click', () => {
            const title = shuffledList[currentIndex].title;
            const chosung = getChosung(title);
            hintBox.textContent = `💡 힌트: [ ${chosung} ]`;
            hintBox.style.display = 'block';
        });

        // 정답 확인 및 처리
        function checkAnswer() {
            const input = answerInput.value.trim();
            const currentTitle = shuffledList[currentIndex].title;
            
            if (!input) {
                emptyEnterCount++;
                if (emptyEnterCount >= 2) {
                    audioPlayer.pause();
                    showToast(`⏭️ 패스! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                        currentIndex++;
                        nextQuestion();
                    });
                } else {
                    answerInput.placeholder = '한 번 더 누르면 패스됩니다.';
                }
                return;
            }
            
            emptyEnterCount = 0;
            const cleanUser = input.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
            const cleanTarget = currentTitle.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
            
            if (cleanUser === cleanTarget) {
                audioPlayer.pause();
                sfxCorrect.currentTime = 0;
                sfxCorrect.play().catch(e=>{});
                
                score++;
                updateScoreDisplay();
                showToast("🎉 정답입니다!", 1200, () => {
                    currentIndex++;
                    nextQuestion();
                });
            } else {
                wrongAttempts++;
                sfxWrong.currentTime = 0;
                sfxWrong.play().catch(e=>{});
                
                answerInput.value = '';
                
                if (wrongAttempts >= 3) {
                    audioPlayer.pause();
                    showToast(`❌ 3회 오답! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                        currentIndex++;
                        nextQuestion();
                    });
                } else {
                    answerInput.placeholder = `❌ 오답! (${3 - wrongAttempts}번의 기회 남음)`;
                }
            }
        }

        document.getElementById('submitBtn').addEventListener('click', checkAnswer);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        // 게임 도중 나가기 버튼
        document.getElementById('exitGameBtn').addEventListener('click', () => {
            if (confirm("정말 게임을 종료하고 나가시겠습니까?")) {
                clearInterval(timer);
                audioPlayer.pause();
                showScreen('startScreen');
            }
        });

        // 게임 종료
        function endGame() {
            clearInterval(timer);
            audioPlayer.pause();
            document.getElementById('finalScore').textContent = isUnlimited ? `${score} / ${shuffledList.length}개` : `${score}개`;
            showScreen('resultScreen');
        }

        // 파이어베이스 랭킹 불러오기
        function loadRanking() {
            const rankList = document.getElementById('rankList');
            if (!rankList) return;

            rankList.innerHTML = '<li style="text-align:center; color:#94a3b8;">전 세계 데이터를 불러오는 중... ⏳</li>';
            
            database.ref('rankings').once('value', (snapshot) => {
                const ranks = [];
                snapshot.forEach((childSnapshot) => {
                    ranks.push(childSnapshot.val());
                });
                
                ranks.sort((a, b) => b.score - a.score);
                
                rankList.innerHTML = '';
                
                if (ranks.length === 0) {
                    rankList.innerHTML = '<li style="text-align:center; color:#94a3b8;">아직 등록된 기록이 없습니다. 첫 1위를 차지하세요!</li>';
                    return;
                }
                
                ranks.slice(0, 50).forEach((r, idx) => {
                    const li = document.createElement('li');
                    li.style.cssText = "display:flex; justify-content:space-between; padding:8px 12px; border-bottom: 1px solid #e2e8f0;";
                    li.innerHTML = `
                        <span><strong>${idx + 1}위.</strong> ${r.name}</span>
                        <span style="color:var(--primary); font-weight:bold;">${r.score}개 <small style="color:#94a3b8; font-weight:normal;">(${r.mode})</small></span>
                    `;
                    rankList.appendChild(li);
                });
            });
        }

        // 랭킹 저장
        const saveRankBtn = document.getElementById('saveRankBtn');
        if (saveRankBtn) {
            saveRankBtn.addEventListener('click', () => {
                const name = prompt("순위표에 등록할 닉네임을 입력하세요 (최대 8글자):");
                
                if (name && name.trim() !== '') {
                    let modeText = isUnlimited ? '무제한' : `${totalTime}초`;
                    if (typeof currentMode !== 'undefined' && currentMode === 'special') {
                        modeText += ' (Special)';
                    }
                    
                    database.ref('rankings').push({
                        name: name.trim().substring(0, 8),
                        score: score,
                        mode: modeText,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }, (error) => {
                        if (error) {
                            alert("저장 실패: " + error.message);
                        } else {
                            alert("🎉 전 세계 명예의 전당에 기록되었습니다!");
                            saveRankBtn.style.display = 'none';
                            loadRanking();
                        }
                    });
                }
            });
        }

        // 화면 이동 이벤트
        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) restartBtn.addEventListener('click', () => showScreen('startScreen'));

        const viewRankBtn = document.getElementById('viewRankBtn');
        if (viewRankBtn) {
            viewRankBtn.addEventListener('click', () => {
                loadRanking();
                showScreen('rankScreen');
            });
        }

        const backToStartBtn = document.getElementById('backToStartBtn');
        if (backToStartBtn) backToStartBtn.addEventListener('click', () => showScreen('startScreen'));
    </script>
</body>
</html>
