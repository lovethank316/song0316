    <!-- Naver 나눔스퀘어 네오 웹폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/webfontworld/naver/NanumSquareNeo.css">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-dark: #357ABD;
            --accent-color: #FF6B6B;
            --bg-color: #F4F7FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --text-muted: #888888;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'NanumSquareNeo', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 28px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* 시작 화면 */
        h1 {
            font-size: 26px;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .setting-group {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 14px;
            font-weight: 700;
        }

        .time-options {
            display: flex;
            gap: 8px;
        }

        .time-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #E2E8F0;
            background: white;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-btn.active {
            border-color: var(--primary-color);
            background-color: #EBF3FC;
            color: var(--primary-color);
        }

        /* 메인 게임 화면 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F8FAFC;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
        }

        .progress-badge {
            font-size: 13px;
            background: #E2E8F0;
            padding: 4px 10px;
            border-radius: 20px;
            color: #475569;
        }

        .timer-box {
            font-size: 18px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-box.warning {
            color: var(--accent-color);
            animation: shake 0.5s infinite alternate;
        }

        @keyframes shake {
            0% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }

        .audio-card {
            background: #F1F5F9;
            padding: 24px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            width: 100%;
        }

        .btn-secondary {
            background: #E2E8F0;
            color: #334155;
            flex: 1;
        }

        .btn-accent {
            background: var(--accent-color);
            color: white;
        }

        .hint-box {
            min-height: 48px;
            background: #FFFBEB;
            border: 1px dashed #F59E0B;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #B45309;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .answer-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #CBD5E1;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .answer-input:focus {
            border-color: var(--primary-color);
        }

        /* 피드백 알림창 (정답/오답/패스 곡 정보 표시) */
        .feedback-toast {
            min-height: 42px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            padding: 8px 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback-toast.show {
            opacity: 1;
        }

        .feedback-toast.correct {
            background-color: #DCFCE7;
            color: #166534;
        }

        .feedback-toast.wrong {
            background-color: #FEE2E2;
            color: #991B1B;
        }

        .feedback-toast.info {
            background-color: #FEF3C7;
            color: #92400E;
        }

        /* 결과 화면 */
        .result-tier {
            font-size: 32px;
            font-weight: 800;
            margin: 10px 0;
        }

        .result-stats {
            background: #F8FAFC;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 15px;
        }

        .pass-notice {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <div class="container">
        <!-- 1. 게임 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div>
                <h1>🎵 섭리 명곡 맞추기</h1>
                <p class="subtitle">음악을 듣고 제목을 맞혀보세요!</p>
            </div>

            <div class="setting-group">
                <label><i class="fa-solid fa-clock"></i> 제한 시간 선택</label>
                <div class="time-options">
                    <button class="time-btn active" data-time="60">1분</button>
                    <button class="time-btn" data-time="180">3분</button>
                    <button class="time-btn" data-time="300">5분</button>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary" style="padding: 16px; font-size: 18px;">게임 시작하기</button>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="game-screen" class="screen">
            <div class="header-bar">
                <span class="progress-badge" id="progress-text">문제 1 / 10</span>
                <div class="timer-box" id="timer-box">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span id="timer-text">01:00</span>
                </div>
                <span>점수: <strong id="score-text" style="color: var(--primary-color);">0</strong></span>
            </div>

            <!-- 피드백 메시지 영역 (곡명/가수 공개) -->
            <div id="feedback-toast" class="feedback-toast"></div>

            <div class="audio-card">
                <i class="fa-solid fa-music" style="font-size: 40px; color: var(--primary-color);"></i>
                <div class="audio-controls">
                    <button class="btn btn-secondary" id="play-5s-btn"><i class="fa-solid fa-play"></i> 5초 듣기</button>
                    <button class="btn btn-secondary" id="play-30s-btn"><i class="fa-solid fa-circle-play"></i> 30초 듣기</button>
                </div>
            </div>

            <div class="hint-box" id="hint-box">
                <button class="btn btn-secondary" id="hint-btn" style="width: 100%; height: 100%; border: none;">💡 초성 힌트 보기</button>
            </div>

            <div class="input-group">
                <input type="text" id="answer-input" class="answer-input" placeholder="곡 제목을 입력하세요" autocomplete="off">
                <button id="submit-btn" class="btn btn-primary" style="width: 80px;">제출</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="pass-notice">※ 입력창이 비어있을 때 Enter 2번 = 패스</span>
                <button id="pass-btn" class="btn btn-secondary" style="padding: 8px 16px; font-size: 13px;">패스 ⏩</button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <h2>🎉 게임 종료!</h2>
            
            <div class="result-tier" id="tier-badge">🥇 골드</div>

            <div class="result-stats">
                <div>맞힌 문제: <strong id="final-score">0</strong>개</div>
                <div>총 진행한 문제: <span id="final-total">0</span>개</div>
                <div>정답률: <span id="final-accuracy">0%</span></div>
            </div>

            <button id="restart-btn" class="btn btn-primary" style="padding: 14px;">다시 도전하기</button>
        </div>
    </div>

        /* ==========================================================================
           2. 변수 및 상태 관리
           ========================================================================== */
        let gameSongs = [];
        let currentIndex = 0;
        let score = 0;
        let totalGameTime = 60; // 기본 1분(60초)
        let remainingTime = 60;
        let timerInterval = null;
        let audioTimeout = null;
        let emptyEnterCount = 0;
        let wrongCount = 0;
        let isProcessing = false; // 연타 방지 플래그

        // DOM 요소
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const audioPlayer = document.getElementById('audio-player');
        const timerText = document.getElementById('timer-text');
        const timerBox = document.getElementById('timer-box');
        const scoreText = document.getElementById('score-text');
        const progressText = document.getElementById('progress-text');
        const answerInput = document.getElementById('answer-input');
        const hintBox = document.getElementById('hint-box');
        const feedbackToast = document.getElementById('feedback-toast');

        /* ==========================================================================
           3. 한글 초성 추출 유틸리티 함수
           ========================================================================== */
        const CHOSEONG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

        function getChoseong(str) {
            let result = '';
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code >= 0 && code <= 11172) {
                    result += CHOSEONG_LIST[Math.floor(code / 588)];
                } else {
                    result += str[i]; // 공백이나 특수문자, 영문 등은 그대로 유지
                }
            }
            return result;
        }

        // 입력값 정규화 (공백 제거, 소문자화)
        function normalizeText(text) {
            return text.replace(/\s+/g, '').toLowerCase();
        }

        /* ==========================================================================
           4. 게임 타이머 & 상태 제어
           ========================================================================== */
        // 시간 선택 버튼 설정
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                totalGameTime = parseInt(e.target.dataset.time);
            });
        });

        function startTimer() {
            remainingTime = totalGameTime;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingTime--;
                updateTimerDisplay();

                if (remainingTime <= Math.floor(totalGameTime * 0.15)) {
                    timerBox.classList.add('warning');
                } else {
                    timerBox.classList.remove('warning');
                }

                if (remainingTime <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const min = Math.floor(remainingTime / 60).toString().padStart(2, '0');
            const sec = (remainingTime % 60).toString().padStart(2, '0');
            timerText.innerText = `${min}:${sec}`;
        }

        /* ==========================================================================
           5. 게임 로직 (시작, 문제 불러오기, 제출, 패스, 종료)
           ========================================================================== */
        function switchScreen(screenName) {
            Object.keys(screens).forEach(key => {
                screens[key].classList.toggle('active', key === screenName);
            });
        }

        function startGame() {
            // 문제 셔플
            gameSongs = [...playlist].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            scoreText.innerText = score;

            switchScreen('game');
            startTimer();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= gameSongs.length) {
                endGame();
                return;
            }

            isProcessing = false;
            wrongCount = 0;
            emptyEnterCount = 0;
            answerInput.value = '';
            answerInput.focus();

            // 진행 상태 업데이트
            progressText.innerText = `문제 ${currentIndex + 1} / ${gameSongs.length}`;

            // 초성 힌트 초기화
            hintBox.innerHTML = `<button class="btn btn-secondary" id="hint-btn" style="width:100%; height:100%; border:none;">💡 초성 힌트 보기</button>`;
            document.getElementById('hint-btn').onclick = showHint;

            // 오디오 세팅
            const currentSong = gameSongs[currentIndex];
            audioPlayer.src = currentSong.src;
            audioPlayer.load();

            // 피드백 토스트 초기화
            hideFeedback();
        }

        function playAudio(duration) {
            stopAudio();
            audioPlayer.currentTime = 0;
            audioPlayer.play().catch(e => console.log("재생 오류:", e));

            audioTimeout = setTimeout(() => {
                audioPlayer.pause();
            }, duration * 1000);
        }

        function stopAudio() {
            if (audioTimeout) clearTimeout(audioTimeout);
            audioPlayer.pause();
        }

        function showHint() {
            const currentSong = gameSongs[currentIndex];
            const choseong = getChoseong(currentSong.title);
            hintBox.innerText = choseong;
        }

        function checkAnswer() {
            if (isProcessing) return;

            const userVal = answerInput.value.trim();
            
            // 빈값 입력 처리 (연속 Enter = 패스)
            if (!userVal) {
                emptyEnterCount++;
                if (emptyEnterCount >= 2) {
                    handlePass();
                } else {
                    showFeedback('info', '💡 한 번 더 Enter를 누르면 패스합니다.');
                }
                return;
            }

            emptyEnterCount = 0;
            const currentSong = gameSongs[currentIndex];

            if (normalizeText(userVal) === normalizeText(currentSong.title)) {
                // 정답!
                isProcessing = true;
                score++;
                scoreText.innerText = score;
                stopAudio();

                showFeedback('correct', `🎉 정답입니다! [${currentSong.artist} - ${currentSong.title}]`);
                
                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 1500);
            } else {
                // 오답!
                wrongCount++;
                answerInput.value = '';
                if (wrongCount >= 3) {
                    // 3회 실패 시 자동 패스 및 정답 공개
                    isProcessing = true;
                    stopAudio();
                    showFeedback('wrong', `❌ 3회 오답! 정답: [${currentSong.artist} - ${currentSong.title}]`);
                    setTimeout(() => {
                        currentIndex++;
                        loadQuestion();
                    }, 2000);
                } else {
                    showFeedback('wrong', `❌ 오답입니다! (남은 기회: ${3 - wrongCount}회)`);
                }
            }
        }

        function handlePass() {
            if (isProcessing) return;
            isProcessing = true;
            stopAudio();

            const currentSong = gameSongs[currentIndex];
            showFeedback('info', `⏩ 패스! 정답은 [${currentSong.artist} - ${currentSong.title}] 이었습니다.`);

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1800);
        }

        function showFeedback(type, text) {
            feedbackToast.className = `feedback-toast show ${type}`;
            feedbackToast.innerText = text;
        }

        function hideFeedback() {
            feedbackToast.className = 'feedback-toast';
            feedbackToast.innerText = '';
        }

        /* ==========================================================================
           6. 시간 기반 dynamic 티어 계산 및 게임 종료
           ========================================================================== */
        function endGame() {
            clearInterval(timerInterval);
            stopAudio();

            const totalPlayed = currentIndex; // 진행한 문제 수
            const accuracy = totalPlayed > 0 ? Math.round((score / totalPlayed) * 100) : 0;

            // 선택한 제한 시간 대비 CPM (분당 정답 개수) 계산
            const minutes = totalGameTime / 60;
            const scorePerMin = score / minutes;

            let tier = "🌱 비기너";
            if (scorePerMin >= 8) tier = "👑 섭리 마스터";
            else if (scorePerMin >= 5) tier = "🥇 골드";
            else if (scorePerMin >= 3) tier = "🥈 실버";
            else if (scorePerMin >= 1) tier = "🥉 브론즈";

            document.getElementById('tier-badge').innerText = tier;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = totalPlayed;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;

            switchScreen('result');
        }

        /* ==========================================================================
           7. 이벤트 리스너 설정
           ========================================================================== */
        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = () => switchScreen('start');

        document.getElementById('play-5s-btn').onclick = () => playAudio(5);
        document.getElementById('play-30s-btn').onclick = () => playAudio(30);

        document.getElementById('submit-btn').onclick = checkAnswer;
        document.getElementById('pass-btn').onclick = handlePass;

        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        /* ==========================================================================
           8. 보안 및 이탈 방지 (탭 전환 시 오디오 일시정지, 단축키 차단)
           ========================================================================== */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopAudio();
        });

        window.addEventListener('blur', stopAudio);

        // F12 개발자도구 및 소스보기 차단
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });
    </script>
