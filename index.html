<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섭리 명곡 맞추기</title>

    <!-- 카카오톡 / SNS 링크 공유 미리보기 설정 -->
<meta property="og:type" content="website">
<meta property="og:title" content="섭리 명곡 맞추기">
<meta property="og:description" content="시간 안에 얼마나 명곡을 맞출 수 있을까? 링크를 눌러 확인하세요!">
<meta property="og:image" content="favicon.png">
    
    <!-- 브라우저 탭 아이콘(파비콘) 설정 -->
    <link rel="icon" href="favicon.png" type="image/png">
    
    <style>
        /* 🌟 전체 폰트 및 배경 리뉴얼 */
        :root {
            --primary: #004b9b;
            --primary-hover: #003a7a;
            --secondary: #8b5cf6;
            --bg-gray: #f4f5f7;
            --text-dark: #1e293b;
            --green: #10b981;
            --yellow: #f59e0b;
        }
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 🌟 우측 상단 로그인(마이페이지) 뱃지 버튼 */
        .top-right-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            z-index: 100;
        }
        .top-right-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 30px 25px;
            position: relative;
            box-sizing: border-box;
        }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 🌟 세련된 타이틀 디자인 */
        .main-title-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .title-line {
            height: 2px;
            width: 30px;
            background-color: var(--primary);
            position: relative;
        }
        .title-line::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            background: white;
            top: -4px;
        }
        .title-line.left::after { right: -4px; }
        .title-line.right::after { left: -4px; }
        .main-title-box h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        /* 🌟 토글 버튼 그룹 (선택지 디자인) */
        .section-label {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .toggle-group {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .toggle-btn {
            background: white;
            border: 2px solid #e2e8f0;
            color: #64748b;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 700;
            flex: 1;
            min-width: 30%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn:hover { border-color: #cbd5e1; background: #f8fafc; }
        .toggle-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #f0f7ff;
            box-shadow: 0 4px 10px rgba(0, 75, 155, 0.1);
        }

        /* 🌟 버튼 스타일 리뉴얼 */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-start {
            background: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(0, 75, 155, 0.3);
        }
        .btn-start:hover { background: var(--primary-hover); }
        
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .btn-outline-green {
            flex: 1;
            background: white;
            border: 2px solid var(--green);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-outline-yellow {
            flex: 1;
            background: white;
            border: 2px solid var(--yellow);
            color: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-sub { background: #f1f5f9; color: #475569; }
        .btn-danger { background: #ef4444; color: white; }
        
        /* 🌟 마이페이지 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
        }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--text-dark); }
        
        .mypage-profile-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .nickname-edit-box {
            text-align: left;
            margin-bottom: 20px;
        }
        .nickname-edit-box label { font-size: 13px; color: #64748b; font-weight: 600; display: block; margin-bottom: 8px; }
        .nickname-input-group { display: flex; gap: 8px; }
        .nickname-input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        .nickname-input-group input:focus { border-color: var(--primary); }
        .btn-change {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 기타 게임화면 요소 (기존 디자인 다듬기) */
        .status-box {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px;
            padding: 15px 20px; margin: 20px 0;
        }
        .status-item { display: flex; flex-direction: column; align-items: center; font-size: 14px; color: #64748b; font-weight: bold; }
        .status-value { font-size: 26px; font-weight: 900; color: var(--primary); margin-top: 4px; }
        
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        .input-area input { flex: 1; padding: 14px 16px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; }
        .input-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 75, 155, 0.15); }
        .input-area button { width: auto; margin: 0; padding: 0 24px; border-radius: 12px; }

        .rank-list { list-style: none; padding: 0; margin: 15px 0; max-height: 400px; overflow-y: auto; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; background: #f9fafb; margin-bottom: 8px; border-radius: 12px; }
        .rank-item:nth-child(1) { background: #fef08a; border: 1px solid #fde047; } 
        .rank-item:nth-child(2) { background: #f1f5f9; border: 1px solid #e2e8f0; } 
        .rank-item:nth-child(3) { background: #ffedd5; border: 1px solid #fed7aa; } 
        
        .toast { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.85); color: white; padding: 15px 20px; border-radius: 12px; z-index: 1000; text-align: center; font-size: 15px; width: 80%; }
        
        .close-x-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 22px; color: #94a3b8; cursor: pointer; }
    </style>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 🌟 우측 상단 로그인 / 마이페이지 버튼 -->
    <div id="topAuthBtn" class="top-right-badge">
        <span style="font-size: 16px;">👤</span> 로그인
    </div>

    <!-- 🌟 마이페이지 모달 -->
    <div id="myPageModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeMyPageBtn" class="close-x-btn">✖</button>
            <div class="modal-title">마이페이지</div>
            
            <div id="loginPromptArea" style="display: none; padding: 20px 0;">
                <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">랭킹 등록을 위해 구글로 로그인해주세요.</p>
                <button id="googleLoginBtn" class="btn btn-start" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: white; color: #1e293b; border: 2px solid #e2e8f0;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20"> 구글로 시작하기
                </button>
            </div>

            <div id="loggedInArea" style="display: none;">
                <div class="mypage-profile-row">
                    <img id="myPageImg" src="" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e2e8f0;">
                    <div style="text-align: left; font-size: 13px; color: #64748b; word-break: break-all;" id="myPageEmail"></div>
                </div>

                <div class="nickname-edit-box">
                    <label>닉네임 변경</label>
                    <div class="nickname-input-group">
                        <input type="text" id="nicknameInput" placeholder="닉네임 입력">
                        <button id="changeNicknameBtn" class="btn-change">변경</button>
                    </div>
                </div>
                
                <button id="logoutBtn" class="btn btn-sub" style="font-size: 14px; padding: 12px; margin-top: 10px;">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 1. 메인 메뉴 화면 -->
        <div id="startScreen" class="screen active">
            
            <!-- 타이틀 영역 -->
            <div class="main-title-box">
                <div class="title-line left"></div>
                <h1>🎵 섭리 명곡 맞추기</h1>
                <div class="title-line right"></div>
            </div>

            <!-- 게임 모드 선택 -->
            <div class="section-label">어떤 모드로 플레이 할까요?</div>
            <div class="toggle-group" id="modeGroup">
                <button class="toggle-btn active" data-val="normal">일반 모드<br><span style="font-size:11px; font-weight:normal;">처음부터</span></button>
                <button class="toggle-btn" data-val="special">Special 모드<br><span style="font-size:11px; font-weight:normal;">중간부터</span></button>
            </div>

            <!-- 제한 시간 선택 -->
            <div class="section-label">제한 시간 선택</div>
            <div class="toggle-group" id="timeGroup">
                <button class="toggle-btn active" data-val="60">60초</button>
                <button class="toggle-btn" data-val="180">3분</button>
                <button class="toggle-btn" data-val="300">5분</button>
                <button class="toggle-btn" data-val="600">10분</button>
                <button class="toggle-btn" data-val="unlimited" style="flex-basis: 100%;">무제한 (도전 모드)</button>
            </div>

            <button id="startBtn" class="btn btn-start">게임 시작</button>
            
            <div class="action-btns">
                <button id="btn-study" class="btn btn-outline-green">📖 공부 모드</button>
                <button id="viewRankBtn" class="btn btn-outline-yellow">🏆 랭킹 보기</button>
            </div>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="gameScreen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button id="exitGameBtn" class="btn btn-sub" style="width: auto; padding: 8px 14px; margin: 0; border-radius: 10px;">나가기</button>
                <h2 style="font-size: 18px; margin: 0; color: var(--primary);">🎵 명곡 맞추기</h2>
            </div>
            
            <div id="toastMessage" class="toast"></div>

            <div class="status-box">
                <div class="status-item">
                    <span id="timerLabel">남은 시간</span>
                    <span id="timer" class="status-value">0</span>
                </div>
                <div class="status-item">
                    맞춘 개수
                    <span id="score" class="status-value">0</span>
                </div>
            </div>

            <div style="margin-bottom: 15px; text-align: center; font-size: 14px; color: #64748b; font-weight: bold;">
                <span>🔊 볼륨: </span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8" style="vertical-align: middle;">
            </div>

            <button id="stopUnlimitedBtn" class="btn btn-danger" style="display:none; border-radius: 12px;">🛑 게임 중단하고 순위 등록</button>

            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <button id="pauseBtn" class="btn btn-sub" style="border-radius: 10px;">⏸️ 일시정지</button>
                <button id="play30Btn" class="btn btn-sub" style="border-radius: 10px;">▶️ 30초 듣기</button>
                <button id="btn-middle-listen" class="btn btn-sub" style="border-radius: 10px;">🎧 중간 10초 듣기</button>

            </div>

            <button id="hintBtn" class="btn btn-sub" style="border-radius: 10px; border: 1px solid #cbd5e1; background: white;">💡 초성 힌트 보기</button>
            <div id="hintBox" style="margin: 10px 0; font-weight: 900; color: var(--primary); text-align: center; font-size: 18px;"></div>

            <div class="input-area">
                <input type="text" id="answerInput" placeholder="정답을 입력하세요" autocomplete="off">
                <button id="submitBtn" class="btn btn-start" style="margin-bottom: 0;">확인</button>
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 8px; text-align: center;">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다.</div>
            <div style="font-size: 12px; color: #ef4444; margin-top: 4px; text-align: center;">* 빈칸 상태에서 엔터를 두 번 연타하면 패스됩니다.</div>
        </div>

        <!-- 3. 결과 및 랭킹 등록 화면 -->
        <div id="resultsScreen" class="screen">
            <h2 style="text-align: center; font-size: 28px;">🎉 게임 종료!</h2>
            <div id="finalScore" style="text-align: center; font-size: 28px; font-weight: 900; color: var(--primary); margin: 20px 0;"></div>
            
            <div style="background: #f8fafc; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 2px solid #e2e8f0;">
                <div style="text-align: center; color: var(--text-dark); font-size: 18px; font-weight: bold; margin-bottom: 10px;">🏆 명예의 전당 등록</div>
                <div id="recordAuthInfo" style="text-align: center;"></div>
                <button id="saveScoreBtn" class="btn btn-start" style="margin-top: 15px;">점수 등록하기</button>
            </div>

            <button id="restartBtn" class="btn btn-sub">다시 하기 (등록 안함)</button>
            <button id="backToStartBtn" class="btn btn-sub">메인 메뉴로</button>
        </div>

        <!-- 4. 명예의 전당 화면 -->
        <div id="rankScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--yellow);">🏆 명예의 전당</h2>
            
            <div class="toggle-group" id="rankTimeGroup" style="margin-bottom: 15px;">
                <button class="toggle-btn active" data-time="60" style="padding: 8px; font-size: 13px;">60초</button>
                <button class="toggle-btn" data-time="180" style="padding: 8px; font-size: 13px;">3분</button>
                <button class="toggle-btn" data-time="300" style="padding: 8px; font-size: 13px;">5분</button>
                <button class="toggle-btn" data-time="600" style="padding: 8px; font-size: 13px;">10분</button>
                <button class="toggle-btn" data-time="unlimited" style="padding: 8px; font-size: 13px; flex-basis: 100%;">무제한</button>
            </div>

            <ul id="rankList" class="rank-list"></ul>
            <button id="closeRankBtn" class="btn btn-sub" style="margin-top: 15px;">메인 메뉴로 돌아가기</button>
        </div>

        <!-- 5. 공부하기 방 화면 -->
        <div id="study-screen" class="screen">
            <h2 style="text-align: center; color: var(--green);">📖 공부 모드</h2>
            <p style="color: #64748b; text-align: center; font-size: 14px;">모든 명곡을 연속해서 들을 수 있습니다.</p>
            <div style="margin: 20px 0; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <div id="study-current-song" style="font-weight: 900; margin-bottom: 12px; color: var(--primary); text-align: center; font-size: 18px;">재생 중인 곡이 없습니다.</div>
                <audio id="study-audio" controls style="width: 100%; outline: none;"></audio>
            </div>
            <ul id="study-playlist" class="rank-list" style="max-height: 250px;"></ul>
            <button id="btn-study-back" class="btn btn-sub">메인 메뉴로 돌아가기</button>
        </div>
    </div>

    <script>
        // 재생목록 (기존 곡 세팅 유지)
        const playlist = [
  // --- Part 1 ---
  { title: "My Way remix", src: "part1/My Way remix.mp3" },
  { title: "My way", src: "part1/My way.mp3" },
  { title: "가는 길", src: "part1/가는 길.mp3" },
  { title: "가랑비", src: "part1/가랑비.mp3" },
  { title: "가르쳐 주었네", src: "part1/가르쳐 주었네.mp3" },
  { title: "가자 때가 됐다 remix", src: "part1/가자 때가 됐다 remix.mp3" },
  { title: "가자 때가 됐다", src: "part1/가자 때가 됐다.mp3" },
  { title: "가자 별봉정으로", src: "part1/가자 별봉정으로.mp3" },
  { title: "가자 오자 대둔산으로", src: "part1/가자 오자 대둔산으로.mp3" },
  { title: "감동되었네 감화되었네", src: "part1/감동되었네 감화되었네.mp3" },
  { title: "걱정 말고 따라오너라", src: "part1/걱정 말고 따라오너라.mp3" },
  { title: "걸작은 연출", src: "part1/걸작은 연출.mp3" },
  { title: "고향 산 너머", src: "part1/고향 산 너머.mp3" },
  { title: "골든 타임 놓치지 말아라", src: "part1/골든 타임 놓치지 말아라.mp3" },
  { title: "골인이다", src: "part1/골인이다.mp3" },
  { title: "광명한 새벽별아", src: "part1/광명한 새벽별아.mp3" },
  { title: "구상대로 행한다면", src: "part1/구상대로 행한다면.mp3" },

        // Firebase 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyBCGLZrV-Tkm66ZjA36WtHCC5RPcglp3iE",
            authDomain: "song0316-d3881.firebaseapp.com",
            databaseURL: "https://song0316-d3881-default-rtdb.firebaseio.com",
            projectId: "song0316-d3881",
            storageBucket: "song0316-d3881.firebasestorage.app",
            messagingSenderId: "31876563990",
            appId: "1:31876563990:web:ff5b3faf9cdb75a3b96137"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let currentUser = null;
        let userNickname = "";

        // 🌟 토글 버튼(선택지) 작동 로직
        let selectedMode = 'normal';
        let selectedTime = '60';

        function setupToggleGroup(groupId, callback) {
            const group = document.getElementById(groupId);
            group.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    if(callback) callback(e.currentTarget.dataset.val || e.currentTarget.dataset.time);
                });
            });
        }
        setupToggleGroup('modeGroup', (val) => selectedMode = val);
        setupToggleGroup('timeGroup', (val) => selectedTime = val);

        // 🌟 마이페이지 및 로그인 로직
        const topAuthBtn = document.getElementById('topAuthBtn');
        const myPageModal = document.getElementById('myPageModal');
        
        topAuthBtn.addEventListener('click', () => { myPageModal.style.display = 'flex'; });
        document.getElementById('closeMyPageBtn').addEventListener('click', () => { myPageModal.style.display = 'none'; });

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                db.ref('users/' + user.uid + '/nickname').once('value').then(snapshot => {
                    userNickname = snapshot.val() || user.displayName;
                    topAuthBtn.innerHTML = `<img src="${user.photoURL}" style="width:24px; height:24px; border-radius:50%; border: 1px solid #ccc;"> <span style="font-weight: 800;">${userNickname}</span>`;
                    document.getElementById('loginPromptArea').style.display = 'none';
                    document.getElementById('loggedInArea').style.display = 'block';
                    document.getElementById('myPageImg').src = user.photoURL;
                    document.getElementById('myPageEmail').textContent = user.email;
                    document.getElementById('nicknameInput').value = userNickname;
                    updateResultAuthUI(true);
                });
            } else {
                userNickname = "";
                topAuthBtn.innerHTML = `<span style="font-size: 16px;">👤</span> 로그인`;
                document.getElementById('loginPromptArea').style.display = 'block';
                document.getElementById('loggedInArea').style.display = 'none';
                updateResultAuthUI(false);
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            auth.signInWithPopup(provider).catch(err => alert("로그인 오류: " + err.message));
        });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("로그아웃 하시겠습니까?")) { auth.signOut(); myPageModal.style.display = 'none'; }
        });

        document.getElementById('changeNicknameBtn').addEventListener('click', () => {
            const newName = document.getElementById('nicknameInput').value.trim();
            if (!newName) return alert("닉네임을 입력해주세요!");
            if (newName.length > 10) return alert("닉네임은 10글자 이내로 입력해주세요.");
            
            db.ref('users/' + currentUser.uid + '/nickname').set(newName).then(() => {
                userNickname = newName;
                topAuthBtn.innerHTML = `<img src="${currentUser.photoURL}" style="width:24px; height:24px; border-radius:50%; border: 1px solid #ccc;"> <span style="font-weight: 800;">${userNickname}</span>`;
                alert("닉네임이 성공적으로 변경되었습니다! 🎉");
                updateResultAuthUI(true);
            }).catch(err => alert("오류: " + err.message));
        });

        function updateResultAuthUI(isLoggedIn) {
            const recordArea = document.getElementById('recordAuthInfo');
            const saveBtn = document.getElementById('saveScoreBtn');
            if (isLoggedIn) {
                recordArea.innerHTML = `
                    <div style="display:inline-flex; align-items:center; background:white; padding:8px 16px; border-radius:20px; border:1px solid #cbd5e1; gap:10px; margin-bottom: 10px;">
                        <img src="${currentUser.photoURL}" style="width:30px; height:30px; border-radius:50%;"> 
                        <b style="color:var(--primary); font-size:16px;">${userNickname}</b> 님의 기록으로 등록됩니다!
                    </div>`;
                saveBtn.disabled = false;
                saveBtn.textContent = "내 점수 랭킹에 올리기";
                saveBtn.className = "btn btn-start";
            } else {
                recordArea.innerHTML = `<div style="color:#ef4444; font-size:14px; margin-bottom:15px; font-weight:bold;">우측 상단 마이페이지에서 로그인해야 등록할 수 있습니다.</div>`;
                saveBtn.disabled = true;
                saveBtn.textContent = "로그인 필요";
                saveBtn.className = "btn btn-sub";
            }
        }

        // 🌟 게임 로직
        let audio = new Audio();
        const correctSfx = new Audio('correct.mp3');
        const wrongSfx = new Audio('wrong.mp3');

        let shuffledPlaylist = [];
        let currentSongIndex = 0;
        let score = 0;
        let timerInterval = null;
        let timeLeft = 0;
        let isUnlimited = false;
        let unlimitedElapsed = 0; 
        let lastEmptySubmitTime = 0; 

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message; toast.style.display = 'block'; toast.style.opacity = '1';
            setTimeout(() => {
                let fadeEffect = setInterval(() => {
                    if (toast.style.opacity > 0) toast.style.opacity -= 0.1;
                    else { clearInterval(fadeEffect); toast.style.display = 'none'; }
                }, 50);
            }, 1500);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            isUnlimited = (selectedTime === 'unlimited');
            timeLeft = isUnlimited ? 0 : parseInt(selectedTime);
            unlimitedElapsed = 0; score = 0; currentSongIndex = 0; lastEmptySubmitTime = 0;
            
            document.getElementById('score').textContent = score;
            document.getElementById('hintBox').textContent = '';
            document.getElementById('answerInput').value = '';
            
            if (isUnlimited) {
                document.getElementById('timerLabel').textContent = '진행 시간';
                document.getElementById('timer').textContent = '0분 0초';
                document.getElementById('stopUnlimitedBtn').style.display = 'block';
            } else {
                document.getElementById('timerLabel').textContent = '남은 시간';
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('stopUnlimitedBtn').style.display = 'none';
            }

            shuffledPlaylist = [...playlist].sort(() => Math.random() - 0.5);
            showScreen('gameScreen');
            playNextSong();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isUnlimited) {
                    unlimitedElapsed++;
                    const m = Math.floor(unlimitedElapsed / 60);
                    const s = unlimitedElapsed % 60;
                    document.getElementById('timer').textContent = `${m}분 ${s}초`;
                } else {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) endGame();
                }
            }, 1000);
        });

        function playNextSong() {
            if (currentSongIndex >= shuffledPlaylist.length) { showToast("모든 곡 완료!"); endGame(); return; }
            audio.src = shuffledPlaylist[currentSongIndex].src;
            document.getElementById('hintBox').textContent = ''; 
            document.getElementById('pauseBtn').textContent = '⏸️ 일시정지';
            document.getElementById('answerInput').focus();

            audio.addEventListener('loadedmetadata', function onLoaded() {
                if (selectedMode === 'special') audio.currentTime = audio.duration * 0.3;
                audio.play().catch(e => console.log("재생 오류", e));
                audio.removeEventListener('loadedmetadata', onLoaded);
            });
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answerInput');
            const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
            const originalTitle = shuffledPlaylist[currentSongIndex].title;
            const correctAnswer = originalTitle.replace(/\s/g, '').toLowerCase();

            if (userAnswer === '') {
                const now = Date.now();
                if (now - lastEmptySubmitTime < 500) { 
                    showToast("패스! 정답은 [" + originalTitle + "]"); wrongSfx.currentTime = 0; wrongSfx.play(); 
                    currentSongIndex++; playNextSong(); lastEmptySubmitTime = 0; 
                } else { showToast("한 번 더 누르면 패스됩니다."); lastEmptySubmitTime = now; }
                return;
            }

            if (userAnswer === correctAnswer) {
                score++; document.getElementById('score').textContent = score;
                showToast("정답입니다! 🎉"); correctSfx.currentTime = 0; correctSfx.play();
                answerInput.value = ''; lastEmptySubmitTime = 0; currentSongIndex++; playNextSong();
            } else {
                showToast("틀렸습니다."); wrongSfx.currentTime = 0; wrongSfx.play();
                answerInput.value = ''; lastEmptySubmitTime = Date.now();
            }
        }

        document.getElementById('submitBtn').addEventListener('click', checkAnswer);
        document.getElementById('answerInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

        function endGame() {
            clearInterval(timerInterval); audio.pause();
            let timeText = "";
            if (isUnlimited) {
                const m = Math.floor(unlimitedElapsed / 60); const s = unlimitedElapsed % 60;
                timeText = `<div style="font-size:16px; color:#64748b; margin-top:5px; font-weight:normal;">(소요 시간: ${m}분 ${s}초)</div>`;
            }
            document.getElementById('finalScore').innerHTML = `${score}점 맞췄습니다!${timeText}`;
            showScreen('resultsScreen');
        }

        document.getElementById('exitGameBtn').addEventListener('click', () => { if(confirm("종료할까요?")) endGame(); });
        document.getElementById('stopUnlimitedBtn').addEventListener('click', endGame);
        document.getElementById('backToStartBtn').addEventListener('click', () => showScreen('startScreen'));
        document.getElementById('restartBtn').addEventListener('click', () => showScreen('startScreen'));
        document.getElementById('volumeSlider').addEventListener('input', (e) => { audio.volume = e.target.value; });
        document.getElementById('pauseBtn').addEventListener('click', (e) => {
            if (audio.paused) { audio.play(); e.target.textContent = '⏸️ 일시정지'; }
            else { audio.pause(); e.target.textContent = '▶️ 재생'; }
        });
        document.getElementById('play30Btn').addEventListener('click', () => { audio.currentTime = 0; audio.play(); setTimeout(() => { audio.pause(); }, 30000); });
        document.getElementById('btn-middle-listen').addEventListener('click', () => { if (!audio.src) return; audio.currentTime = audio.duration / 2; audio.play(); setTimeout(() => { audio.pause(); }, 10000); });
        document.getElementById('hintBtn').addEventListener('click', () => {
            const title = shuffledPlaylist[currentSongIndex].title;
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let hint = "";
            for (let i = 0; i < title.length; i++) {
                const code = title.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) hint += cho[Math.floor(code / 588)]; else hint += title.charAt(i);
            }
            document.getElementById('hintBox').textContent = "💡 " + hint;
        });

        // 🌟 랭킹 저장 (설정한 닉네임으로 저장)
        document.getElementById('saveScoreBtn').addEventListener('click', () => {
            if (!currentUser) return; 
            
            const dataToSave = {
                uid: currentUser.uid,
                name: userNickname, 
                photo: currentUser.photoURL,
                score: score,
                date: new Date().toISOString()
            };
            if (isUnlimited) dataToSave.timeSpent = unlimitedElapsed;

            db.ref('rankings/' + selectedTime).push(dataToSave).then(() => {
                alert("명예의 전당에 성공적으로 등록되었습니다! 🏆");
                showScreen('startScreen');
            }).catch(error => alert("오류가 발생했습니다: " + error.message));
        });

        // 🌟 랭킹 보기 및 탭 전환
        document.getElementById('viewRankBtn').addEventListener('click', () => {
            showScreen('rankScreen');
            document.querySelectorAll('#rankTimeGroup .toggle-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('#rankTimeGroup .toggle-btn[data-time="60"]').classList.add('active');
            loadRankings('60'); 
        });
        document.getElementById('closeRankBtn').addEventListener('click', () => showScreen('startScreen'));

        setupToggleGroup('rankTimeGroup', (timeLimit) => loadRankings(timeLimit));

        function loadRankings(timeLimit) {
            const rankListUl = document.getElementById('rankList');
            rankListUl.innerHTML = '<li style="text-align:center; color:#64748b;">데이터를 불러오는 중입니다...</li>';

            db.ref('rankings/' + timeLimit).once('value', snapshot => {
                rankListUl.innerHTML = ''; 
                const rankings = [];
                snapshot.forEach(child => { rankings.push(child.val()); });

                rankings.sort((a, b) => {
                    if (b.score === a.score && timeLimit === 'unlimited') return (a.timeSpent || Infinity) - (b.timeSpent || Infinity);
                    return b.score - a.score;
                });

                if (rankings.length === 0) { rankListUl.innerHTML = '<li style="text-align:center; padding: 20px; color:#64748b;">아직 등록된 기록이 없습니다.</li>'; return; }

                rankings.slice(0, 50).forEach((data, index) => {
                    const li = document.createElement('li');
                    li.className = 'rank-item';
                    const dateObj = new Date(data.date);
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;
                    
                    let timeHTML = '';
                    if (timeLimit === 'unlimited' && data.timeSpent != null) {
                        const m = Math.floor(data.timeSpent / 60); const s = data.timeSpent % 60;
                        timeHTML = `<div style="font-size: 12px; color: #64748b; margin-top: 2px;">소요 시간: <strong style="color:var(--primary);">${m}분 ${s}초</strong></div>`;
                    }
                    const photoSrc = data.photo ? data.photo : 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png';

                    li.innerHTML = `
                        <div style="display:flex; align-items:center; gap: 12px;">
                            <div style="font-weight:900; font-size:18px; color: var(--primary); width:25px; text-align:center;">${index + 1}</div>
                            <img src="${photoSrc}" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                            <div style="display:flex; flex-direction:column; text-align:left;">
                                <span style="font-size: 15px; color:var(--text-dark);"><strong>${data.name}</strong></span>
                                ${timeHTML}
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:900; font-size:18px; color: var(--text-dark);">${data.score}점</div>
                            <div style="font-size:12px; color:#94a3b8;">${dateStr}</div>
                        </div>
                    `;
                    rankListUl.appendChild(li);
                });
            });
        }

        // 📚 공부하기 방 기능
        const btnStudy = document.getElementById('btn-study');
        const studyPlaylistUl = document.getElementById('study-playlist');
        const studyAudio = document.getElementById('study-audio');
        let currentStudyIndex = -1;

        btnStudy.addEventListener('click', () => {
            const password = prompt("공부하기 방에 입장하려면 비밀번호를 입력하세요:");
            if (password === "0316") {
                showScreen('study-screen');
                if (studyPlaylistUl.innerHTML === '') {
                    playlist.forEach((song, index) => {
                        const li = document.createElement('li');
                        li.className = 'rank-item';
                        li.style.cursor = 'pointer';
                        li.innerHTML = `<strong>${index + 1}. ${song.title}</strong> <span style="font-size:12px; color:var(--primary);">듣기 🎧</span>`;
                        li.addEventListener('click', () => playStudySong(index, li));
                        studyPlaylistUl.appendChild(li);
                    });
                }
            } else if (password !== null) alert("비밀번호가 틀렸습니다.");
        });
        document.getElementById('btn-study-back').addEventListener('click', () => { studyAudio.pause(); showScreen('startScreen'); });
        
        function playStudySong(index, element) {
            const song = playlist[index];
            studyAudio.src = song.src; studyAudio.play();
            document.getElementById('study-current-song').textContent = `▶ 재생 중: ${song.title}`;
            currentStudyIndex = index;
            studyPlaylistUl.querySelectorAll('li').forEach(li => { li.style.background = '#f9fafb'; li.style.border = 'none'; });
            element.style.background = '#e0f2fe'; element.style.border = '1px solid #7dd3fc';
        }
        studyAudio.addEventListener('ended', () => {
            if (currentStudyIndex + 1 < playlist.length) {
                const nextLi = studyPlaylistUl.children[currentStudyIndex + 1];
                playStudySong(currentStudyIndex + 1, nextLi);
                if (nextLi) nextLi.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
