<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명곡 맞추기 게임</title>
    
    <!-- Open Graph 설정 (og:image 제거됨) -->
    <meta property="og:title" content="명곡 맞추기 게임" />
    <meta property="og:description" content="노래를 듣고 제목을 맞춰보세요! 최고 기록에 도전해보세요." />
    
    <style>
        :root {
            --primary-color: #4A90E2;
            --accent-color: #FF6B6B;
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-color: #FFFFFF;
            --sub-text: #AAAAAA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2A2A2A;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .audio-player {
            margin: 20px 0;
        }

        audio {
            width: 100%;
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .leaderboard {
            margin-top: 28px;
            text-align: left;
        }

        .leaderboard h3 {
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .ranking-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: #2A2A2A;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .ranking-item .rank {
            font-weight: bold;
            color: var(--primary-color);
            width: 40px;
        }

        .ranking-item .name {
            flex-grow: 1;
            text-align: left;
        }

        .ranking-item .score {
            font-weight: bold;
            color: var(--accent-color);
        }

        .hint-btn {
            background-color: #333;
            margin-bottom: 12px;
            font-size: 14px;
            padding: 10px;
        }

        .hint-text {
            color: var(--sub-text);
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. 메인 화면 -->
        <div id="start-screen" class="screen active">
            <h1>🎵 명곡 맞추기 게임</h1>
            <p style="margin-bottom: 20px; color: var(--sub-text);">노래를 듣고 제목을 맞춰보세요!</p>
            <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="12" />
            <button id="start-btn">게임 시작하기</button>

            <!-- 실시간 랭킹 -->
            <div class="leaderboard">
                <h3>🏆 실시간 랭킹 (최고 점수)</h3>
                <ul id="ranking-list" class="ranking-list">
                    <li style="color: var(--sub-text); text-align:center;">랭킹 불러오는 중...</li>
                </ul>
            </div>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="game-screen" class="screen">
            <div class="score-board">
                현재 점수: <span id="current-score" style="color: var(--primary-color);">0</span>점
            </div>

            <div class="audio-player">
                <audio id="audio-player" controls></audio>
            </div>

            <div id="hint-area" class="hint-text"></div>
            <button id="hint-btn" class="hint-btn">💡 힌트 보기</button>

            <input type="text" id="answer-input" placeholder="정답 (노래 제목 입력)" autocomplete="off" />
            <button id="submit-btn">제출하기</button>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <h1>게임 종료!</h1>
            <p style="font-size: 20px; margin: 16px 0;">최종 점수: <span id="final-score" style="color: var(--accent-color); font-weight: bold;">0</span>점</p>
            <p id="high-score-msg" style="color: var(--primary-color); font-size: 14px; margin-bottom: 20px;"></p>
            <button id="restart-btn">다시 도전하기</button>
        </div>
    </div>

        let currentQuestionIndex = 0;
        let score = 0;
        let playerNickname = "";

        // UI 요소
        const startScreen = document.getElementById("start-screen");
        const gameScreen = document.getElementById("game-screen");
        const resultScreen = document.getElementById("result-screen");
        const nicknameInput = document.getElementById("nickname-input");
        const startBtn = document.getElementById("start-btn");
        const currentScoreEl = document.getElementById("current-score");
        const audioPlayer = document.getElementById("audio-player");
        const answerInput = document.getElementById("answer-input");
        const submitBtn = document.getElementById("submit-btn");
        const hintBtn = document.getElementById("hint-btn");
        const hintArea = document.getElementById("hint-area");
        const finalScoreEl = document.getElementById("final-score");
        const highScoreMsg = document.getElementById("high-score-msg");
        const restartBtn = document.getElementById("restart-btn");
        const rankingListEl = document.getElementById("ranking-list");

        // 🏆 실시간 랭킹 수신
        function listenRankings() {
            const rankingRef = ref(db, 'rankings');
            onValue(rankingRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const rankingsArray = Object.values(data);
                    
                    // 점수 기준 내림차순 정렬
                    rankingsArray.sort((a, b) => b.score - a.score);

                    rankingListEl.innerHTML = "";
                    rankingsArray.slice(0, 10).forEach((item, index) => {
                        const li = document.createElement("li");
                        li.className = "ranking-item";
                        li.innerHTML = `
                            <span class="rank">${index + 1}위</span>
                            <span class="name">${escapeHtml(item.nickname)}</span>
                            <span class="score">${item.score}점</span>
                        `;
                        rankingListEl.appendChild(li);
                    });
                } else {
                    rankingListEl.innerHTML = `<li style="color: var(--sub-text); text-align:center;">등록된 랭킹이 없습니다.</li>`;
                }
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
        }

        listenRankings();

        // 🚀 게임 시작
        startBtn.addEventListener("click", () => {
            const name = nicknameInput.value.trim();
            if (!name) {
                alert("닉네임을 입력해 주세요!");
                return;
            }
            playerNickname = name;
            score = 0;
            currentQuestionIndex = 0;

            startScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            gameScreen.classList.add("active");

            loadQuestion();
        });

        // 🎼 문제 불러오기
        function loadQuestion() {
            if (currentQuestionIndex >= playlist.length) {
                endGame();
                return;
            }

            const currentSong = playlist[currentQuestionIndex];
            audioPlayer.src = currentSong.src;
            audioPlayer.play().catch(() => {});
            
            answerInput.value = "";
            hintArea.textContent = "";
            currentScoreEl.textContent = score;
        }

        // 💡 힌트 보기
        hintBtn.addEventListener("click", () => {
            const currentSong = playlist[currentQuestionIndex];
            hintArea.textContent = `💡 힌트: ${currentSong.hint}`;
        });

        // 🎯 정답 체크
        function checkAnswer() {
            const userAnswer = answerInput.value.trim().replace(/\s+/g, "");
            const correctAnswer = playlist[currentQuestionIndex].title.replace(/\s+/g, "");

            if (userAnswer === correctAnswer) {
                alert("🎉 정답입니다!");
                score += 10;
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert("❌ 틀렸습니다. 다시 시도해보세요!");
            }
        }

        submitBtn.addEventListener("click", checkAnswer);
        answerInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkAnswer();
        });

        // 🏁 게임 종료 및 최고 점수 덮어쓰기 (중복 등록 방지)
        async function endGame() {
            audioPlayer.pause();
            gameScreen.classList.remove("active");
            resultScreen.classList.add("active");
            finalScoreEl.textContent = score;

            if (currentUser) {
                const userScoreRef = ref(db, `rankings/${currentUser.uid}`);
                
                try {
                    const snapshot = await get(userScoreRef);
                    let shouldUpdate = false;

                    if (snapshot.exists()) {
                        const existingData = snapshot.val();
                        if (score > existingData.score) {
                            shouldUpdate = true;
                            highScoreMsg.textContent = "🎊 최고 기록을 경신했습니다!";
                        } else {
                            highScoreMsg.textContent = `(이전 최고 기록: ${existingData.score}점)`;
                        }
                    } else {
                        shouldUpdate = true;
                        highScoreMsg.textContent = "🏆 첫 기록이 등록되었습니다!";
                    }

                    // 최고 점수인 경우에만 덮어쓰기 저장
                    if (shouldUpdate) {
                        await set(userScoreRef, {
                            nickname: playerNickname,
                            score: score,
                            updatedAt: Date.now()
                        });
                    }
                } catch (error) {
                    console.error("점수 저장 오류:", error);
                }
            }
        }

        // 🔄 다시 시작
        restartBtn.addEventListener("click", () => {
            resultScreen.classList.remove("active");
            startScreen.classList.add("active");
        });
    </script>
