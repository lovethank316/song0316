<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 섭리 명곡 맞추기</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* 시작 화면 */
        .start-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
        }

        select {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
        }

        /* 게임 화면 */
        .status-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .status-item .label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .status-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .player-card {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-sub);
            font-size: 14px;
        }

        input[type="range"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .hint-box {
            background: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            display: none;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .notice {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        /* 토스트 알림창 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            z-index: 100;
            display: none;
            width: 80%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            word-break: keep-all;
        }

        /* 결과 & 랭킹 화면 */
        .result-card, .rank-card {
            text-align: center;
            padding: 20px 0;
        }

        .result-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .score-display {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 24px;
        }

        .rank-list {
            list-style: none;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
        }

        .rank-list li {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        .rank-list li:last-child { border-bottom: none; }

        /* 공통 버튼 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-full { width: 100%; padding: 16px; font-size: 16px; }
        .btn-sub { background: #e2e8f0; color: var(--text-main); }
        .btn-sub:hover { background: #cbd5e1; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { filter: brightness(0.9); }
        .btn-success { background: var(--success); color: white; }

        /* 버전 표시 */
        .footer-version {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎵 섭리 명곡 맞추기</h1>
    </div>

    <!-- 1. 게임 시작 화면 -->
    <div id="startScreen" class="screen active">
        <div class="start-group">
            <div class="select-wrapper">

                    <option value="600">10분</option>
                    <option value="unlimited">무제한 모드</option>
                </select>
            </div>
            <button class="btn btn-full" id="startBtn">🎮 게임 시작</button>
            <button class="btn btn-full btn-sub" id="viewRankBtn">🏆 순위표 보기</button>
        </div>
    </div>

    <!-- 2. 게임 진행 화면 -->
    <div id="gameScreen" class="screen">
        <div class="status-board">
            <div class="status-item">
                <span class="label">⏱️ 남은 시간</span>
                <span class="value" id="timer">01:00</span>
            </div>
            <div class="status-item">
                <span class="label">🎯 맞춘 개수</span>
                <span class="value" id="score">0개</span>
            </div>
        </div>

        <div class="player-card">
            <div class="controls-row">
                <button class="btn btn-sub" id="pauseBtn">▶️ 재생 (5초)</button>
                <button class="btn" id="play30Btn">▶️ 30초 듣기</button>
            </div>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 16px;">
            <button class="btn btn-warning" id="hintBtn">💡 초성 힌트 보기</button>
        </div>
        <div class="hint-box" id="hintBox"></div>

        <div class="input-group">
            <input type="text" id="answerInput" placeholder="정답 입력 (빈칸 시 엔터 2번 = 패스)" autocomplete="off">
            <button class="btn" id="submitBtn">확인</button>
        </div>
        <p class="notice">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다.</p>
        
        <!-- 오디오 (효과음 & 음악) -->
        <audio id="audioPlayer"></audio>
        <audio id="sfxCorrect" src="correct.mp3"></audio>
        <audio id="sfxWrong" src="wrong.mp3"></audio>

        <!-- 알림창 (Toast) -->
        <div id="toastMessage" class="toast">정답 알림창</div>
    </div>

    <!-- 3. 게임 종료 화면 -->
    <div id="resultScreen" class="screen">
        <div class="result-card">
            <div class="result-title">게임 종료!</div>
            <div class="score-display" id="finalScore">0개</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                <button class="btn btn-success" id="saveRankBtn">💾 기록 저장하기</button>
                <button class="btn btn-sub" id="restartBtn">🏠 처음으로</button>
            </div>
        </div>
    </div>

    <!-- 4. 순위표 화면 -->
    <div id="rankScreen" class="screen">
        <div class="rank-card">
            <div class="result-title">🏆 명예의 전당</div>
            <p class="notice">※ 내 기기(브라우저)의 로컬 기록입니다.</p>
            <ul class="rank-list" id="rankList">
                <!-- JS에서 채워짐 -->
            </ul>
            <button class="btn btn-full btn-sub" id="backToStartBtn">🏠 뒤로 가기</button>
        </div>
    </div>
</div>

<div class="footer-version">(버전 : BETA)</div>

// 변수 설정
let shuffledList = [];
let currentIndex = 0;
let score = 0;
let timer = null;
let timeLeft = 60;
let emptyEnterCount = 0;
let wrongAttempts = 0;
let isUnlimited = false;
let maxPlaySeconds = 5; 

// DOM Elements
const screens = document.querySelectorAll('.screen');
const timeSelect = document.getElementById('timeSelect');
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const audioPlayer = document.getElementById('audioPlayer');
const sfxCorrect = document.getElementById('sfxCorrect');
const sfxWrong = document.getElementById('sfxWrong');
const answerInput = document.getElementById('answerInput');
const hintBox = document.getElementById('hintBox');
const toastMessage = document.getElementById('toastMessage');
const rankList = document.getElementById('rankList');

// 셔플 함수
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

// 화면 전환
function showScreen(screenId) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

// 토스트 메시지
function showToast(msg, duration = 2000, callback = null) {
    toastMessage.textContent = msg;
    toastMessage.style.display = 'block';
    
    // 알림이 떠있는 동안 입력창 비활성화
    answerInput.disabled = true;
    document.getElementById('submitBtn').disabled = true;

    setTimeout(() => {
        toastMessage.style.display = 'none';
        answerInput.disabled = false;
        document.getElementById('submitBtn').disabled = false;
        answerInput.focus();
        if (callback) callback();
    }, duration);
}

// 초성 추출 함수 (Point 1)
function getChosung(str) {
    const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    let result = "";
    for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
        else result += str.charAt(i); // 한글이 아닌 경우 원본 유지(영어, 숫자, 띄어쓰기)
    }
    return result;
}

// 점수 업데이트 (Point 2)
function updateScoreDisplay() {
    if (isUnlimited) {
        scoreEl.textContent = `${score} / ${shuffledList.length}개`;
    } else {
        scoreEl.textContent = `${score}개`;
    }
}

// 게임 시작
document.getElementById('startBtn').addEventListener('click', () => {
    const selectedTime = timeSelect.value;
    isUnlimited = (selectedTime === 'unlimited');
    timeLeft = isUnlimited ? 0 : parseInt(selectedTime);
    
    score = 0;
    currentIndex = 0;
    shuffledList = shuffle([...playlist]);
    updateScoreDisplay();
    
    if (isUnlimited) {
        timerEl.textContent = "무제한";
    } else {
        updateTimerDisplay();
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) endGame();
        }, 1000);
    }
    
    showScreen('gameScreen');
    nextQuestion();
});

function updateTimerDisplay() {
    if (isUnlimited) return;
    const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const sec = String(timeLeft % 60).padStart(2, '0');
    timerEl.textContent = `${min}:${sec}`;
}

// 문제 로드
function nextQuestion() {
    if (currentIndex >= shuffledList.length) {
        endGame();
        return;
    }
    hintBox.style.display = 'none';
    answerInput.value = '';
    answerInput.placeholder = '정답 입력 (빈칸 시 엔터 2번 = 패스)';
    emptyEnterCount = 0;
    wrongAttempts = 0; // 틀린 횟수 초기화
    
    const currentSong = shuffledList[currentIndex];
    audioPlayer.src = currentSong.src;
    audioPlayer.volume = document.getElementById('volumeSlider').value;
    
    playAudioLimit(5); // 최초 5초 재생
}

// 오디오 재생 제한 (Point 6)
function playAudioLimit(seconds) {
    maxPlaySeconds = seconds;
    audioPlayer.currentTime = 0;
    audioPlayer.play().catch(e => console.log('Auto play blocked'));
    document.getElementById('pauseBtn').textContent = '⏸️ 일시정지';
}

audioPlayer.addEventListener('timeupdate', () => {
    if (audioPlayer.currentTime >= maxPlaySeconds && !audioPlayer.paused) {
        audioPlayer.pause();
        document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
    }
});

// 오디오 버튼 제어
document.getElementById('pauseBtn').addEventListener('click', () => {
    if (audioPlayer.paused) {
        playAudioLimit(5);
    } else {
        audioPlayer.pause();
        document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
    }
});

document.getElementById('play30Btn').addEventListener('click', () => {
    playAudioLimit(30);
});

document.getElementById('volumeSlider').addEventListener('input', (e) => {
    audioPlayer.volume = e.target.value;
});

// 힌트 보기
document.getElementById('hintBtn').addEventListener('click', () => {
    const title = shuffledList[currentIndex].title;
    const chosung = getChosung(title);
    hintBox.textContent = `💡 힌트: [ ${chosung} ]`;
    hintBox.style.display = 'block';
});

// 정답 확인 및 처리 (Point 3 & 8)
function checkAnswer() {
    const input = answerInput.value.trim();
    const currentTitle = shuffledList[currentIndex].title;
    
    // 패스 처리 (빈칸 엔터 2번)
    if (!input) {
        emptyEnterCount++;
        if (emptyEnterCount >= 2) {
            audioPlayer.pause();
            showToast(`⏭️ 패스! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                currentIndex++;
                nextQuestion();
            });
        } else {
            answerInput.placeholder = '한 번 더 누르면 패스됩니다.';
        }
        return;
    }
    
    emptyEnterCount = 0;
    const cleanUser = input.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
    const cleanTarget = currentTitle.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
    
    if (cleanUser === cleanTarget) {
        // 정답 (효과음 재생)
        audioPlayer.pause();
        sfxCorrect.currentTime = 0;
        sfxCorrect.play().catch(e=>{});
        
        score++;
        updateScoreDisplay();
        showToast("🎉 정답입니다!", 1200, () => {
            currentIndex++;
            nextQuestion();
        });
    } else {
        // 오답 처리
        wrongAttempts++;
        sfxWrong.currentTime = 0;
        sfxWrong.play().catch(e=>{});
        
        answerInput.value = '';
        
        if (wrongAttempts >= 3) {
            audioPlayer.pause();
            showToast(`❌ 3회 오답! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                currentIndex++;
                nextQuestion();
            });
        } else {
            answerInput.placeholder = `❌ 오답! (${3 - wrongAttempts}번의 기회 남음)`;
        }
    }
}

document.getElementById('submitBtn').addEventListener('click', checkAnswer);
answerInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkAnswer();
});

// 게임 종료
function endGame() {
    clearInterval(timer);
    audioPlayer.pause();
    document.getElementById('finalScore').textContent = isUnlimited ? `${score} / ${shuffledList.length}개` : `${score}개`;
    showScreen('resultScreen');
}

// 랭킹 시스템 로직 (Point 5)
function loadRanking() {
    const ranks = JSON.parse(localStorage.getItem('melodyRank') || '[]');
    rankList.innerHTML = '';
    
    if(ranks.length === 0) {
        rankList.innerHTML = '<li style="text-align:center; color:#94a3b8;">아직 등록된 기록이 없습니다.</li>';
        return;
    }
    
    // 점수 내림차순 정렬
    ranks.sort((a, b) => b.score - a.score);
    
    ranks.forEach((r, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${idx + 1}위. ${r.name}</span> <span>${r.score}개 (${r.mode})</span>`;
        rankList.appendChild(li);
    });
}

document.getElementById('saveRankBtn').addEventListener('click', () => {
    const name = prompt("순위표에 등록할 닉네임을 입력하세요 (최대 8글자):");
    if(name) {
        const ranks = JSON.parse(localStorage.getItem('melodyRank') || '[]');
        const modeText = isUnlimited ? '무제한' : `${timeSelect.value}초`;
        ranks.push({ name: name.substring(0, 8), score: score, mode: modeText });
        localStorage.setItem('melodyRank', JSON.stringify(ranks));
        alert("기록이 저장되었습니다!");
        document.getElementById('saveRankBtn').style.display = 'none'; // 중복 방지
    }
});

// 화면 이동 버튼들
document.getElementById('restartBtn').addEventListener('click', () => showScreen('startScreen'));
document.getElementById('viewRankBtn').addEventListener('click', () => {
    loadRanking();
    showScreen('rankScreen');
});
document.getElementById('backToStartBtn').addEventListener('click', () => showScreen('startScreen'));

</script>
