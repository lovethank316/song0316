<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섭리 명곡 맞추기</title>
    
    <!-- 🌟 브라우저 탭 아이콘(파비콘) 설정 -->
    <link rel="icon" href="favicon.png" type="image/png">
    
    <style>
        /* 기본 스타일 */
        :root {
            --primary: #4f46e5;
            --text-gray: #4b5563;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            position: relative; /* 🌟 알림창(토스트)의 위치 기준점이 됩니다 */
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .btn-main { background: #4f46e5; color: white; }
        .btn-sub { background: #f3f4f6; color: #374151; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 20px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: #64748b;
            font-weight: bold;
        }
        .status-value {
            font-size: 24px;
            color: var(--primary);
            margin-top: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            align-items: stretch;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        .input-area button {
            width: auto;
            margin: 0;
            padding: 0 24px;
            font-size: 16px;
        }

        /* 🌟 위치가 수정된 토스트 알림 (컨테이너 중앙 배치) */
        .toast {
            display: none;
            position: absolute; /* container를 기준으로 위치 잡음 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 1000;
            text-align: center;
            font-size: 15px;
            width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none; /* 클릭 방해 금지 (마우스가 통과함) */
        }

        .study-list {
            max-height: 300px;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 15px 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: #f9fafb;
        }
        .study-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .study-list li:hover { background-color: #e0e7ff; }
        .study-list li.playing { background-color: #c7d2fe; font-weight: bold; color: #3730a3; }

        .rank-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            background: #f9fafb;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        .rank-item:nth-child(1) { background: #fef08a; } 
        .rank-item:nth-child(2) { background: #e2e8f0; } 
        .rank-item:nth-child(3) { background: #fed7aa; } 
        
        .rank-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .rank-time-btn {
            width: auto;
            padding: 8px 12px;
            margin: 0;
            font-size: 13px;
        }
        .rank-time-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .time-highlight {
            font-size: 1.3em;
            font-weight: 900;
            color: var(--primary);
        }

        /* 🌟 팝업 안내창 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }
        .close-x-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 🌟 사이트 이전 안내 팝업창 -->
    <div id="noticeModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="closeNoticeX" class="close-x-btn">✖</button>
            <h2 style="margin-top: 10px; color: #4f46e5;">📢 공지사항</h2>
            <p style="font-size: 15px; line-height: 1.5; color: #333; margin: 20px 0;">
                7일 뒤 사이트 주소가<br>
                <strong style="color: #ef4444; font-size: 16px;">konhe.github.io/song0316</strong><br>
                으로 바뀝니다.
            </p>
            <button id="hideTodayBtn" class="btn btn-sub" style="font-size: 14px; margin-bottom: 0;">오늘 하루 안 보기</button>
        </div>
    </div>

    <div class="container">
        <!-- 1. 메인 메뉴 화면 -->
        <div id="startScreen" class="screen active">
            <h1 style="text-align: center; margin-bottom: 30px; font-size: 28px;">🎵 섭리 명곡 맞추기</h1>
            
            <div class="form-group">
                <label for="modeSelect">게임 모드</label>
                <select id="modeSelect">
                    <option value="normal">일반 모드 (처음부터)</option>
                    <option value="special">Special 모드 (중간부터)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="timeSelect">제한 시간</label>
                <select id="timeSelect">
                    <option value="60">1분</option>
                    <option value="180">3분</option>
                    <option value="300">5분</option>
                    <option value="600">10분</option>
                    <option value="unlimited">무제한</option>
                </select>
            </div>

            <button id="startBtn" class="btn btn-main">게임 시작</button>
            <button id="viewRankBtn" class="btn btn-sub">🏆 명예의 전당</button>
            <button id="btn-study" class="btn btn-secondary" style="margin-top: 10px;">📚 공부하기</button>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="gameScreen" class="screen">
            <div class="game-header" style="display: flex; justify-content: space-between; align-items: center;">
                <button id="exitGameBtn" class="btn btn-sub" style="width: auto; padding: 6px 12px;">나가기</button>
                <h2>🎵 섭리 명곡 맞추기</h2>
            </div>
            
            <!-- 토스트 메시지가 컨테이너 안으로 들어왔습니다 -->
            <div id="toastMessage" class="toast"></div>

            <div class="status-box">
                <div class="status-item">
                    <span id="timerLabel">남은 시간</span>
                    <span id="timer" class="status-value">0</span>
                </div>
                <div class="status-item">
                    맞춘 개수
                    <span id="score" class="status-value">0</span>
                </div>
            </div>

            <div class="volume-control" style="margin-bottom: 15px;">
                <span>🔊 볼륨</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
            </div>

            <button id="stopUnlimitedBtn" class="btn btn-danger" style="display:none;">🛑 게임 중단하고 순위 등록</button>

            <div class="controls-box" style="display: flex; gap: 8px; margin-bottom: 10px;">
                <button id="pauseBtn" class="btn btn-sub">⏸️ 일시정지</button>
                <button id="play30Btn" class="btn btn-sub">▶️ 30초 듣기</button>
                <button id="btn-middle-listen" class="btn btn-sub">🎧 중간 10초 듣기</button>
            </div>

            <button id="hintBtn" class="btn btn-sub">💡 초성 힌트 보기</button>
            <div id="hintBox" style="margin: 10px 0; font-weight: bold; color: #4f46e5; text-align: center;"></div>

            <div class="input-area">
                <input type="text" id="answerInput" placeholder="정답을 입력하세요" autocomplete="off">
                <button id="submitBtn" class="btn btn-main">확인</button>
            </div>
            <div style="font-size: 12px; color: #888; margin-top: 5px;">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다.</div>
            <div style="font-size: 12px; color: #ef4444; margin-top: 5px;">* 빈칸 상태에서 빠르게 엔터를 두 번 연타하면 패스됩니다.</div>
        </div>

        <!-- 3. 결과 및 랭킹 등록 화면 -->
        <div id="resultsScreen" class="screen">
            <h2 style="text-align: center;">🎉 게임 종료!</h2>
            <div id="finalScore" style="text-align: center; font-size: 24px; font-weight: bold; color: #4f46e5; margin: 20px 0;"></div>
            
            <div class="form-group" style="background: #f8fafc; padding: 15px; border-radius: 8px;">
                <label>🏆 명예의 전당 등록</label>
                <input type="text" id="playerName" placeholder="이름을 입력하세요 (예: 섭리인)" maxlength="10">
                <button id="saveScoreBtn" class="btn btn-main" style="margin-top: 10px;">점수 등록하기</button>
            </div>

            <button id="restartBtn" class="btn btn-sub">다시 하기 (등록 안함)</button>
            <button id="backToStartBtn" class="btn btn-secondary">메인 메뉴로</button>
        </div>

        <!-- 4. 명예의 전당 화면 -->
        <div id="rankScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 15px;">🏆 명예의 전당</h2>
            
            <div class="rank-tabs">
                <button class="btn btn-sub rank-time-btn active" data-time="60">1분</button>
                <button class="btn btn-sub rank-time-btn" data-time="180">3분</button>
                <button class="btn btn-sub rank-time-btn" data-time="300">5분</button>
                <button class="btn btn-sub rank-time-btn" data-time="600">10분</button>
                <button class="btn btn-sub rank-time-btn" data-time="unlimited">무제한</button>
            </div>

            <ul id="rankList" class="rank-list"></ul>

            <button id="closeRankBtn" class="btn btn-secondary" style="margin-top: 15px;">메인 메뉴로 돌아가기</button>
        </div>

        <!-- 5. 📚 공부하기 방 화면 -->
        <div id="study-screen" class="screen">
            <h2 style="text-align: center;">📚 공부하기</h2>
            <p style="color: #666; text-align: center; font-size: 14px;">모든 명곡을 연속해서 들을 수 있습니다.</p>
            <div style="margin: 15px 0;">
                <div id="study-current-song" style="font-weight: bold; margin-bottom: 8px; color: #4f46e5; text-align: center;">재생 중인 곡이 없습니다.</div>
                <audio id="study-audio" controls style="width: 100%;"></audio>
            </div>
            <ul id="study-playlist" class="study-list"></ul>
            <button id="btn-study-back" class="btn btn-secondary">메인 메뉴로 돌아가기</button>
        </div>
    </div>

        // 🌟 1. 팝업 공지창 로직
        const noticeModal = document.getElementById('noticeModal');
        const closeNoticeX = document.getElementById('closeNoticeX');
        const hideTodayBtn = document.getElementById('hideTodayBtn');
        
        // 기기의 오늘 날짜를 가져옵니다 (예: "2026. 8. 22.")

        // 저장된 날짜가 오늘 날짜와 다르면(또는 없으면) 팝업을 띄웁니다.
        if (localStorage.getItem('hideSongNoticeDate') !== todayString) {
            noticeModal.style.display = 'flex';
        }

        // 'X' 버튼을 누르면 그냥 닫습니다. (새로고침하면 다시 나옴)

            noticeModal.style.display = 'none';

        hideTodayBtn.addEventListener('click', () => {
            localStorage.setItem('hideSongNoticeDate', todayString);
            noticeModal.style.display = 'none';

            apiKey: "AIzaSyBCGLZrV-Tkm66ZjA36WtHCC5RPcglp3iE",
            authDomain: "song0316-d3881.firebaseapp.com",
            databaseURL: "https://song0316-d3881-default-rtdb.firebaseio.com",
            projectId: "song0316-d3881",
            storageBucket: "song0316-d3881.firebasestorage.app",
            messagingSenderId: "31876563990",
            appId: "1:31876563990:web:ff5b3faf9cdb75a3b96137"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audio = new Audio();
        const correctSfx = new Audio('correct.mp3');
        const wrongSfx = new Audio('wrong.mp3');

        let shuffledPlaylist = [];
        let currentSongIndex = 0;
        let score = 0;
        let timerInterval = null;
        let timeLeft = 0;
        let isUnlimited = false;
        let currentTimeMode = "60"; 
        let unlimitedElapsed = 0; 
        let lastEmptySubmitTime = 0; 

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.style.display = 'block';
            toast.style.opacity = '1';
            setTimeout(() => {
                let fadeEffect = setInterval(() => {
                    if (!toast.style.opacity) { toast.style.opacity = 1; }
                    if (toast.style.opacity > 0) { toast.style.opacity -= 0.1; } 
                    else { clearInterval(fadeEffect); toast.style.display = 'none'; }
                }, 50);
            }, 1500);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            const timeValue = document.getElementById('timeSelect').value;
            currentTimeMode = timeValue; 
            isUnlimited = (timeValue === 'unlimited');
            timeLeft = isUnlimited ? 0 : parseInt(timeValue);
            unlimitedElapsed = 0;
            
            score = 0;
            currentSongIndex = 0;
            lastEmptySubmitTime = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('hintBox').textContent = '';
            document.getElementById('answerInput').value = '';
            
            if (isUnlimited) {
                document.getElementById('timerLabel').textContent = '진행 시간';
                document.getElementById('timer').textContent = '0분 0초';
                document.getElementById('stopUnlimitedBtn').style.display = 'block';
            } else {
                document.getElementById('timerLabel').textContent = '남은 시간';
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('stopUnlimitedBtn').style.display = 'none';
            }

            shuffledPlaylist = [...playlist].sort(() => Math.random() - 0.5);
            showScreen('gameScreen');
            playNextSong();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isUnlimited) {
                    unlimitedElapsed++;
                    const m = Math.floor(unlimitedElapsed / 60);
                    const s = unlimitedElapsed % 60;
                    document.getElementById('timer').textContent = `${m}분 ${s}초`;
                } else {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) endGame();
                }
            }, 1000);
        });

        function playNextSong() {
            if (currentSongIndex >= shuffledPlaylist.length) {
                showToast("모든 곡을 다 맞추셨습니다!");
                endGame();
                return;
            }
            const mode = document.getElementById('modeSelect').value;
            audio.src = shuffledPlaylist[currentSongIndex].src;
            document.getElementById('hintBox').textContent = ''; 
            document.getElementById('pauseBtn').textContent = '⏸️ 일시정지';
            document.getElementById('answerInput').focus();

            audio.addEventListener('loadedmetadata', function onLoaded() {
                if (mode === 'special') audio.currentTime = audio.duration * 0.3;
                audio.play().catch(e => console.log("재생 오류", e));
                audio.removeEventListener('loadedmetadata', onLoaded);
            });
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answerInput');
            const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
            const originalTitle = shuffledPlaylist[currentSongIndex].title;
            const correctAnswer = originalTitle.replace(/\s/g, '').toLowerCase();

            if (userAnswer === '') {
                const now = Date.now();
                if (now - lastEmptySubmitTime < 500) { 
                    showToast("패스! 정답은 [" + originalTitle + "] 입니다.");
                    wrongSfx.currentTime = 0; wrongSfx.play(); 
                    currentSongIndex++; playNextSong(); lastEmptySubmitTime = 0; 
                } else {
                    showToast("한 번 더 누르면 패스됩니다."); lastEmptySubmitTime = now;
                }
                return;
            }

            if (userAnswer === correctAnswer) {
                score++;
                document.getElementById('score').textContent = score;
                showToast("정답입니다! 🎉");
                correctSfx.currentTime = 0; correctSfx.play();
                answerInput.value = ''; lastEmptySubmitTime = 0; currentSongIndex++; playNextSong();
            } else {
                showToast("틀렸습니다. 다시 시도해보세요!");
                wrongSfx.currentTime = 0; wrongSfx.play();
                answerInput.value = ''; lastEmptySubmitTime = Date.now();
            }
        }

        document.getElementById('submitBtn').addEventListener('click', checkAnswer);
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        function endGame() {
            clearInterval(timerInterval);
            audio.pause();
            
            let timeText = "";
            if (isUnlimited) {
                const m = Math.floor(unlimitedElapsed / 60);
                const s = unlimitedElapsed % 60;
                timeText = `<div style="font-size:16px; color:#64748b; margin-top:5px;">(소요 시간: ${m}분 ${s}초)</div>`;
            }
            
            document.getElementById('finalScore').innerHTML = `최종 점수: ${score}점 ${timeText}`;
            document.getElementById('playerName').value = ''; 
            showScreen('resultsScreen');
        }

        document.getElementById('exitGameBtn').addEventListener('click', () => { if(confirm("게임을 종료하시겠습니까?")) endGame(); });
        document.getElementById('stopUnlimitedBtn').addEventListener('click', endGame);
        document.getElementById('backToStartBtn').addEventListener('click', () => showScreen('startScreen'));
        document.getElementById('restartBtn').addEventListener('click', () => showScreen('startScreen'));

        document.getElementById('volumeSlider').addEventListener('input', (e) => { audio.volume = e.target.value; });
        document.getElementById('pauseBtn').addEventListener('click', (e) => {
            if (audio.paused) { audio.play(); e.target.textContent = '⏸️ 일시정지'; }
            else { audio.pause(); e.target.textContent = '▶️ 재생'; }
        });
        document.getElementById('play30Btn').addEventListener('click', () => {
            audio.currentTime = 0; audio.play(); setTimeout(() => { audio.pause(); }, 30000);
        });
        document.getElementById('btn-middle-listen').addEventListener('click', () => {
            if (!audio.src) return;
            audio.currentTime = audio.duration / 2; audio.play();
            setTimeout(() => { audio.pause(); }, 10000);
        });
        document.getElementById('hintBtn').addEventListener('click', () => {
            const title = shuffledPlaylist[currentSongIndex].title;
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let hint = "";
            for (let i = 0; i < title.length; i++) {
                const code = title.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) hint += cho[Math.floor(code / 588)];
                else hint += title.charAt(i);
            }
            document.getElementById('hintBox').textContent = "💡 " + hint;
        });

        // 명예의 전당 로직
        document.getElementById('saveScoreBtn').addEventListener('click', () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) { alert("이름을 입력해주세요!"); return; }
            
            const dataToSave = {
                name: name,
                score: score,
                date: new Date().toISOString()
            };
            if (isUnlimited) dataToSave.timeSpent = unlimitedElapsed;

            db.ref('rankings/' + currentTimeMode).push(dataToSave).then(() => {
                alert("등록되었습니다!");
                showScreen('startScreen');
            }).catch(error => alert("오류가 발생했습니다: " + error.message));
        });

        document.getElementById('viewRankBtn').addEventListener('click', () => {
            showScreen('rankScreen');
            document.querySelectorAll('.rank-time-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.rank-time-btn[data-time="60"]').classList.add('active');
            loadRankings('60'); 
        });
        document.getElementById('closeRankBtn').addEventListener('click', () => showScreen('startScreen'));

        document.querySelectorAll('.rank-time-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.rank-time-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                loadRankings(e.target.getAttribute('data-time'));
            });
        });

        function loadRankings(timeLimit) {
            const rankListUl = document.getElementById('rankList');
            rankListUl.innerHTML = '<li style="text-align:center;">데이터를 불러오는 중입니다...</li>';

            db.ref('rankings/' + timeLimit).once('value', snapshot => {
                rankListUl.innerHTML = ''; 
                const rankings = [];
                snapshot.forEach(child => { rankings.push(child.val()); });

                rankings.sort((a, b) => {
                    if (b.score === a.score && timeLimit === 'unlimited') {
                        return (a.timeSpent || Infinity) - (b.timeSpent || Infinity);
                    }
                    return b.score - a.score;
                });

                if (rankings.length === 0) {
                    rankListUl.innerHTML = '<li style="text-align:center; padding: 20px;">아직 등록된 기록이 없습니다.</li>';
                    return;
                }

                rankings.slice(0, 50).forEach((data, index) => {
                    const li = document.createElement('li');
                    li.className = 'rank-item';
                    
                    const dateObj = new Date(data.date);
                    const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;
                    
                    let timeHTML = '';
                    if (timeLimit === 'unlimited' && data.timeSpent != null) {
                        const m = Math.floor(data.timeSpent / 60);
                        const s = data.timeSpent % 60;
                        timeHTML = `<div style="font-size: 13px; color: #64748b; margin-top: 4px;">
                            소요 시간: <span class="time-highlight">${m}</span>분 <span class="time-highlight">${s}</span>초
                        </div>`;
                    }

                    li.innerHTML = `
                        <div style="display:flex; flex-direction:column;">
                            <span><strong>${index + 1}위</strong>. ${data.name}</span>
                            ${timeHTML}
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold; font-size:16px;">${data.score}점</div>
                            <div style="font-size:12px; color:#888;">${dateStr}</div>
                        </div>
                    `;
                    rankListUl.appendChild(li);
                });
            });
        }

        // 📚 공부하기 방 기능
        const btnStudy = document.getElementById('btn-study');
        const btnStudyBack = document.getElementById('btn-study-back');
        const studyPlaylistUl = document.getElementById('study-playlist');
        const studyAudio = document.getElementById('study-audio');
        const studyCurrentSong = document.getElementById('study-current-song');
        let currentStudyIndex = -1;

        btnStudy.addEventListener('click', () => {
            const password = prompt("공부하기 방에 입장하려면 비밀번호를 입력하세요:");
            if (password === "0316") {
                showScreen('study-screen');
                if (studyPlaylistUl.innerHTML === '') renderStudyPlaylist();
            } else if (password !== null) alert("비밀번호가 틀렸습니다.");
        });
        btnStudyBack.addEventListener('click', () => { studyAudio.pause(); showScreen('startScreen'); });
        function renderStudyPlaylist() {
            playlist.forEach((song, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${song.title}`;
                li.addEventListener('click', () => playStudySong(index));
                studyPlaylistUl.appendChild(li);
            });
        }
        function playStudySong(index) {
            const song = playlist[index];
            studyAudio.src = song.src;
            studyAudio.play();
            studyCurrentSong.textContent = `▶ 재생 중: ${song.title}`;
            currentStudyIndex = index;
            const allLis = studyPlaylistUl.querySelectorAll('li');
            allLis.forEach(li => li.classList.remove('playing'));
            if (allLis[index]) allLis[index].classList.add('playing');
        }
        studyAudio.addEventListener('ended', () => {
            if (currentStudyIndex + 1 < playlist.length) {
                playStudySong(currentStudyIndex + 1);
                const nextLi = studyPlaylistUl.children[currentStudyIndex];
                if (nextLi) nextLi.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
</body>
</html>
