<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섭리 명곡 맞추기</title>
    <style>
        /* 기본 스타일 */
        :root {
            --primary: #4f46e5;
            --text-gray: #4b5563;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .hidden { display: none !important; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .btn-main { background: #4f46e5; color: white; }
        .btn-main:hover { background: #4338ca; }
        .btn-sub { background: #f3f4f6; color: #374151; }
        .btn-sub:hover { background: #e5e7eb; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* 토스트 및 알림 메시지 */
        .toast {
            text-align: center;
            font-weight: bold;
            color: #4f46e5;
            min-height: 24px;
            margin: 8px 0;
        }

        /* 📚 공부하기 방 플레이리스트 스타일 */
        .study-list {
            max-height: 300px;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 15px 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: #f9fafb;
        }
        .study-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .study-list li:last-child { border-bottom: none; }
        .study-list li:hover { background-color: #e0e7ff; }
        .study-list li.playing {
            background-color: #c7d2fe;
            font-weight: bold;
            color: #3730a3;
        }

        /* 🏆 랭킹 리스트 스타일 */
        .rank-list {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .rank-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <!-- 1. 메인 메뉴 화면 -->
        <div id="startScreen" class="screen active">
            <h1 style="text-align: center; margin-bottom: 30px; font-size: 28px;">🎵 섭리 명곡 맞추기</h1>
            
            <div class="form-group">
                <label for="modeSelect">게임 모드</label>
                <select id="modeSelect">
                    <option value="normal">일반 모드 (처음부터)</option>
                    <option value="special">Special 모드 (중간부터)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="timeSelect">제한 시간</label>
                <select id="timeSelect">
                    <option value="60">1분</option>
                    <option value="180">3분</option>
                    <option value="300">5분</option>
                    <option value="600">10분</option>
                    <option value="unlimited">무제한</option>
                </select>
            </div>

            <button id="startBtn" class="btn btn-main">게임 시작</button>
            <button id="viewRankBtn" class="btn btn-sub">🏆 명예의 전당</button>
            <button id="btn-study" class="btn btn-secondary" style="margin-top: 10px;">📚 공부하기</button>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="gameScreen" class="screen">
            <div class="game-header" style="display: flex; justify-content: space-between; align-items: center;">
                <button id="exitGameBtn" class="btn btn-sub" style="width: auto; padding: 6px 12px;">나가기</button>
                <h2>🎵 섭리 명곡 맞추기</h2>
            </div>
            
            <div id="toastMessage" class="toast"></div>

            <div class="status-box" style="display: flex; justify-content: space-around; margin: 15px 0; background: #f3f4f6; padding: 10px; border-radius: 8px;">
                <div>남은 시간: <span id="timer" style="font-weight: bold; color: #ef4444;">0</span></div>
                <div>맞춘 개수: <span id="score" style="font-weight: bold; color: #4f46e5;">0</span></div>
            </div>

            <div class="volume-control" style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <span>🔊 볼륨</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8" style="flex: 1;">
            </div>

            <button id="stopUnlimitedBtn" class="btn btn-danger" style="display:none;">🛑 게임 중단하고 순위 등록</button>

            <div class="controls-box" style="display: flex; gap: 8px; margin-bottom: 10px;">
                <button id="pauseBtn" class="btn btn-sub">⏸️ 일시정지</button>
                <button id="play30Btn" class="btn btn-sub">▶️ 30초 듣기</button>
                <button id="btn-middle-listen" class="btn btn-sub">🎧 중간 10초 듣기</button>
            </div>

            <button id="hintBtn" class="btn btn-sub">💡 초성 힌트 보기</button>
            <div id="hintBox" style="margin: 10px 0; font-weight: bold; text-align: center; color: #4f46e5;"></div>

            <div class="input-area" style="margin-top: 15px;">
                <input type="text" id="answerInput" placeholder="정답 입력 (엔터 또는 확인)" autocomplete="off">
                <button id="submitBtn" class="btn btn-main" style="margin-top: 8px;">확인</button>
            </div>
            <div style="font-size: 12px; color: #888; margin-top: 5px; text-align: center;">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다. 빈 칸으로 제출 시 패스됩니다.</div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="resultsScreen" class="screen">
            <h2 style="text-align: center;">🎉 게임 종료!</h2>
            <div id="finalScore" style="text-align: center; font-size: 20px; margin: 20px 0;"></div>
            <button id="restartBtn" class="btn btn-main">다시 하기</button>
            <button id="backToStartBtn" class="btn btn-sub">메인 메뉴로</button>
        </div>

        <!-- 4. 📚 공부하기 방 화면 -->
        <div id="study-screen" class="screen">
            <h2 style="text-align: center;">📚 공부하기</h2>
            <p style="color: #666; text-align: center; font-size: 14px;">모든 명곡을 연속해서 들을 수 있습니다.</p>
            
            <div style="margin: 15px 0;">
                <div id="study-current-song" style="font-weight: bold; margin-bottom: 8px; color: #4f46e5; text-align: center;">재생 중인 곡이 없습니다.</div>
                <audio id="study-audio" controls style="width: 100%;"></audio>
            </div>

            <ul id="study-playlist" class="study-list"></ul>

            <button id="btn-study-back" class="btn btn-secondary">메인 메뉴로 돌아가기</button>
        </div>

        <!-- 5. 🏆 명예의 전당 화면 -->
        <div id="rankScreen" class="screen">
            <h2 style="text-align: center;">🏆 명예의 전당</h2>
            <ul id="rankList" class="rank-list"></ul>
            <button id="rankBackBtn" class="btn btn-secondary">메인 메뉴로 돌아가기</button>
        </div>
    </div>

        /* 화면 전환 함수 */
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        /* 띄어쓰기 및 특수문자 공백 제거 정규화 */
        function normalizeString(str) {
            return str.replace(/[\s,.~!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/g, '').toLowerCase();
        }

        /* 한글 초성 추출 함수 */
        function getChoseong(str) {
            const choseongList = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            let result = '';
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                if (code >= 44032 && code <= 55203) {
                    const idx = Math.floor((code - 44032) / 588);
                    result += choseongList[idx];
                } else {
                    result += str[i];
                }
            }
            return result;
        }

        /* 메시지 출력 함수 */
        function showToast(msg) {
            toastMessage.textContent = msg;
            setTimeout(() => {

            }, 2000);
        }

            score = 0;

            scoreElem.textContent = score;

            answerInput.value = '';
            isPaused = false;
            pauseBtn.textContent = '⏸️ 일시정지';

            // 모드 및 시간 설정
            currentMode = modeSelect.value;
            const timeValue = timeSelect.value;

            if (timeValue === 'unlimited') {
                isUnlimited = true;
                timerElem.textContent = '무제한';
                stopUnlimitedBtn.style.display = 'block';
            } else {
                isUnlimited = false;
                timeLeft = parseInt(timeValue);
                timerElem.textContent = timeLeft;
                stopUnlimitedBtn.style.display = 'none';
                startTimer();
            }

            // 플레이리스트 랜덤 셔플
            gamePlaylist = [...playlist].sort(() => Math.random() - 0.5);

            showScreen('gameScreen');
            loadSong(currentIndex);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return;
                timeLeft--;
                timerElem.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        /* 음원 로드 및 재생 */
        function loadSong(index) {
            if (index >= gamePlaylist.length) {
                showToast("모든 문제를 다 맞추셨습니다!");
                endGame();
                return;
            }

            const song = gamePlaylist[index];
            gameAudio.pause();
            gameAudio = new Audio(song.src);
            gameAudio.volume = parseFloat(volumeSlider.value);

            // 재생 준비 후 시작 위치 설정
            gameAudio.onloadedmetadata = () => {
                if (currentMode === 'special' && gameAudio.duration) {
                    // Special 모드: 곡 중간 위치 (20% ~ 60% 사이 구간에서 시작)
                    const randomStart = gameAudio.duration * (0.2 + Math.random() * 0.4);
                    gameAudio.currentTime = randomStart;
                }
                gameAudio.play().catch(e => console.log("자동 재생 정책 제한:", e));
            };

            hintBox.textContent = '';
            answerInput.value = '';
            answerInput.focus();
        }

            if (e.key === 'Enter') checkAnswer();

        function checkAnswer() {
            const userAns = normalizeString(answerInput.value);
            const currentSong = gamePlaylist[currentIndex];
            const realAns = normalizeString(currentSong.title);

            // 빈 칸 입력이면 패스
            if (userAns === '') {
                showToast(`⏭️ 패스! 정답: ${currentSong.title}`);
                nextSong();
                return;
            }

            if (userAns === realAns) {
                score++;
                scoreElem.textContent = score;
                showToast(`⭕ 정답입니다! (${currentSong.title})`);
                nextSong();
            } else {
                showToast("❌ 오답입니다. 다시 시도해 보세요!");
                answerInput.value = '';
            }
        }

        function nextSong() {
            currentIndex++;

            clearInterval(timerInterval);
            if (gameAudio) {
                gameAudio.pause();
                gameAudio.currentTime = 0;
            }
        }

        /* ==========================================
           7. 게임 종료 및 순위 등록 (Firebase 연동)
        ========================================== */
        function endGame() {
            stopGame();
            document.getElementById('finalScore').textContent = `최종 점수: ${score}개 정답!`;
            showScreen('resultsScreen');

            setTimeout(() => {
                const userName = prompt("게임이 종료되었습니다! 랭킹에 등록할 닉네임을 입력해 주세요:", "익명");
                if (userName && userName.trim() !== "") {
                    saveScore(userName.trim(), score);
                }
            }, 300);
        }

        function saveScore(name, finalScore) {
            db.ref('rankings').push({
                name: name,
                score: finalScore,
                mode: currentMode,
                date: new Date().toLocaleDateString('ko-KR')
            }).then(() => {
                alert("순위가 성공적으로 등록되었습니다!");
            }).catch(err => {
                console.error("랭킹 저장 오류:", err);
            });
        }

        restartBtn.addEventListener('click', startGame);
        backToStartBtn.addEventListener('click', () => showScreen('startScreen'));

        /* ==========================================
           8. 🏆 명예의 전당 (랭킹 조회)
        ========================================== */
        viewRankBtn.addEventListener('click', () => {
            showScreen('rankScreen');
            loadRankings();
        });

        rankBackBtn.addEventListener('click', () => showScreen('startScreen'));

        function loadRankings() {
            rankList.innerHTML = '<li>순위를 불러오는 중...</li>';
            db.ref('rankings').orderByChild('score').limitToLast(20).once('value', (snapshot) => {
                rankList.innerHTML = '';
                const ranks = [];
                snapshot.forEach(child => {
                    ranks.push(child.val());
                });
                ranks.reverse(); // 내림차순 정렬

                if (ranks.length === 0) {
                    rankList.innerHTML = '<li>등록된 랭킹 정보가 없습니다.</li>';
                    return;
                }

                ranks.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${idx + 1}위</strong> ${item.name}</span>
                        <span>${item.score}점 (${item.mode === 'special' ? 'Special' : '일반'})</span>
                    `;
                    rankList.appendChild(li);
                });
            });
        }

        /* ==========================================
           9. 📚 공부하기 방 기능 (비밀번호: 0316)
        ========================================== */
        const btnStudy = document.getElementById('btn-study');
        const btnStudyBack = document.getElementById('btn-study-back');
        const studyPlaylistUl = document.getElementById('study-playlist');
        const studyAudio = document.getElementById('study-audio');
        const studyCurrentSong = document.getElementById('study-current-song');
        let currentStudyIndex = -1;

        btnStudy.addEventListener('click', () => {
            const password = prompt("공부하기 방에 입장하려면 비밀번호를 입력하세요:");
            if (password === "0316") {
                showScreen('study-screen');
                if (studyPlaylistUl.innerHTML === '') {
                    renderStudyPlaylist();
                }
            } else if (password !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        });

        btnStudyBack.addEventListener('click', () => {
            studyAudio.pause();
            showScreen('startScreen');
        });

        function renderStudyPlaylist() {
            playlist.forEach((song, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${song.title}`;
                li.addEventListener('click', () => playStudySong(index));
                studyPlaylistUl.appendChild(li);
            });
        }

        function playStudySong(index) {
            const song = playlist[index];
            studyAudio.src = song.src;
            studyAudio.play();
            studyCurrentSong.textContent = `▶ 재생 중: ${song.title}`;
            currentStudyIndex = index;

            const allLis = studyPlaylistUl.querySelectorAll('li');
            allLis.forEach(li => li.classList.remove('playing'));
            if (allLis[index]) allLis[index].classList.add('playing');
        }

        studyAudio.addEventListener('ended', () => {
            if (currentStudyIndex + 1 < playlist.length) {
                playStudySong(currentStudyIndex + 1);
                const nextLi = studyPlaylistUl.children[currentStudyIndex];
                if (nextLi) nextLi.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
</body>
</html>
