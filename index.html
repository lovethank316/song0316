<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #4f46e5;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .music-player {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 25px 15px;
            margin-bottom: 25px;
        }
        .disc-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .disc-icon.playing {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .controls button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .controls button:hover {
            background-color: #4338ca;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #4f46e5;
        }
        .btn-submit {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #059669;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-secondary {
            flex: 1;
            padding: 10px;
            background-color: #f3f4f6;
            color: #4b5563;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        .message {
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }
        .message.correct { color: #10b981; }
        .message.wrong { color: #ef4444; }
        .message.info { color: #6b7280; }
        
        audio { display: none; }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🎵 노래 제목 맞추기</h1>
    <div class="subtitle">PART 1 & PART 5 모음</div>
    
    <div class="status-bar">
        <span>진행: <strong id="currentCount">1</strong> / <span id="totalCount">0</span></span>
        <span>점수: <strong id="score">0</strong>점</span>
    </div>

    <div class="music-player">
        <div class="disc-icon" id="disc">📻</div>
        <div class="controls">
            <button id="playBtn">▶️ 노래 듣기</button>
        </div>
        <audio id="audioPlayer"></audio>
    </div>

    <div class="input-group">
        <input type="text" id="answerInput" placeholder="노래 제목을 입력하세요..." autocomplete="off">
        <button class="btn-submit" id="submitBtn">확인</button>
    </div>

    <div class="action-buttons">
        <button class="btn-secondary" id="skipBtn">⏭️ 패스 (정답 확인)</button>
        <button class="btn-secondary" id="nextBtn" style="display:none; background-color:#4f46e5; color:white;">다음 문제 ➡️</button>
    </div>

    <div class="message" id="message"></div>

// 게임 변수
let gameList = [];
let currentIndex = 0;
let score = 0;
let isAnswered = false;

// DOM 요소
const audioPlayer = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const skipBtn = document.getElementById('skipBtn');
const nextBtn = document.getElementById('nextBtn');
const message = document.getElementById('message');
const currentCountEl = document.getElementById('currentCount');
const totalCountEl = document.getElementById('totalCount');
const scoreEl = document.getElementById('score');
const disc = document.getElementById('disc');

// Shuffle 함수
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

// 초기화
function initGame() {
    gameList = shuffle([...playlist]);
    currentIndex = 0;
    score = 0;
    
    totalCountEl.textContent = gameList.length;
    scoreEl.textContent = score;
    
    loadSong();
}

// 문제 로드
function loadSong() {
    isAnswered = false;
    const currentSong = gameList[currentIndex];
    
    audioPlayer.src = currentSong.src;
    audioPlayer.load();
    
    currentCountEl.textContent = currentIndex + 1;
    answerInput.value = '';
    answerInput.disabled = false;
    submitBtn.disabled = false;
    
    message.textContent = '';
    message.className = 'message';
    
    nextBtn.style.display = 'none';
    skipBtn.style.display = 'block';
    playBtn.textContent = '▶️ 노래 듣기';
    disc.classList.remove('playing');
}

// 재생/일시정지
playBtn.addEventListener('click', () => {
    if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
            playBtn.textContent = '⏸️ 일시정지';
            disc.classList.add('playing');
        }).catch(err => {
            alert("음원을 찾을 수 없습니다: " + gameList[currentIndex].src);
        });
    } else {
        audioPlayer.pause();
        playBtn.textContent = '▶️ 노래 듣기';
        disc.classList.remove('playing');
    }
});

audioPlayer.addEventListener('ended', () => {
    playBtn.textContent = '▶️ 다시 듣기';
    disc.classList.remove('playing');
});

// 정답 비교 정규화
function cleanText(str) {
    return str.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
}

// 정답 확인
function checkAnswer() {
    if (isAnswered) return;
    
    const userInput = answerInput.value.trim();
    if (!userInput) {
        message.textContent = '노래 제목을 입력해 주세요!';
        message.className = 'message info';
        return;
    }
    
    const currentSong = gameList[currentIndex];
    
    if (cleanText(userInput) === cleanText(currentSong.title)) {
        score += 10;
        scoreEl.textContent = score;
        message.textContent = `🎉 정답입니다! (${currentSong.title})`;
        message.className = 'message correct';
        finishCurrentTurn();
    } else {
        message.textContent = '❌ 틀렸습니다. 다시 시도해보세요!';
        message.className = 'message wrong';
    }
}

function finishCurrentTurn() {
    isAnswered = true;
    answerInput.disabled = true;
    submitBtn.disabled = true;
    skipBtn.style.display = 'none';
    nextBtn.style.display = 'block';
}

// 패스
skipBtn.addEventListener('click', () => {
    if (isAnswered) return;
    const currentSong = gameList[currentIndex];
    message.textContent = `💡 정답은 [ ${currentSong.title} ] 입니다!`;
    message.className = 'message info';
    finishCurrentTurn();
});

// 다음 문제
nextBtn.addEventListener('click', () => {
    audioPlayer.pause();
    currentIndex++;
    
    if (currentIndex >= gameList.length) {
        alert(`게임 완료! 👏\n총 점수: ${score}점`);
        initGame();
    } else {
        loadSong();
    }
});

submitBtn.addEventListener('click', checkAnswer);
answerInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkAnswer();
});

initGame();
</script>
