<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노래 맞추기 게임</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            text-align: center;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        select, input, button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .hint-box {
            background-color: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 10;
        }

        ul {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="toastMessage" class="toast"></div>

        <!-- 시작 화면 -->
        <div id="startScreen" class="screen active">
            <h1>🎵 노래 맞추기</h1>
            <div class="form-group">
                <label for="modeSelect">게임 모드</label>
                <select id="modeSelect">
                    <option value="normal">일반 모드 (처음부터)</option>
                    <option value="special">Special 모드 (중간부터)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="timeSelect">제한 시간</label>
                <select id="timeSelect">
                    <option value="60">60초</option>
                    <option value="120">120초</option>
                    <option value="180">180초</option>
                    <option value="unlimited">무제한</option>
                </select>
            </div>
            <button id="startBtn">게임 시작</button>
            <button id="viewRankBtn" class="btn-secondary">🏆 랭킹 보기</button>
        </div>

        <!-- 게임 화면 -->
        <div id="gameScreen" class="screen">
            <div class="header-info">
                <span>⏱️ <span id="timer">01:00</span></span>
                <span>점수: <span id="score">0개</span></span>
            </div>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
            </div>
            <div class="controls">
                <button id="pauseBtn">⏸️ 일시정지</button>
                <button id="play30Btn" class="btn-secondary">▶️ 30초 듣기</button>
            </div>
            <button id="hintBtn" class="btn-secondary">💡 초성 힌트 보기</button>
            <div id="hintBox" class="hint-box"></div>
            <div class="form-group">
                <input type="text" id="answerInput" placeholder="정답 입력 (빈칸 시 엔터 2번 = 패스)" autocomplete="off">
                <button id="submitBtn">제출</button>
            </div>
            <button id="exitGameBtn" class="btn-secondary" style="margin-top: 10px;">🚪 게임 나가기</button>
        </div>

        <!-- 결과 화면 -->
        <div id="resultScreen" class="screen">
            <h2>🎉 게임 종료!</h2>
            <p style="text-align: center; font-size: 20px; margin: 20px 0;">최종 점수: <strong id="finalScore" style="color: var(--primary);">0개</strong></p>
            <button id="saveRankBtn">🏆 랭킹 등록하기</button>
            <button id="restartBtn" class="btn-secondary">다시 하기</button>
        </div>

        <!-- 랭킹 화면 -->
        <div id="rankScreen" class="screen">
            <h2>🏆 명예의 전당</h2>
            <ul id="rankList"></ul>
            <button id="backToStartBtn" class="btn-secondary">메인으로 돌아가기</button>
        </div>
    </div>

            { title: '혼인 잔치 휴거의 역사', src: 'part5/혼인 잔치 휴거의 역사.mp3' },
            { title: '화평의 세계다', src: 'part5/화평의 세계다.mp3' },

            { title: '희망의 천 년 역사 신부들', src: 'part5/희망의 천 년 역사 신부들.mp3' },

        // 변수 설정
        let shuffledList = [];
        let currentIndex = 0;
        let score = 0;
        let timer = null;
        let totalTime = 60;
        let timeLeft = 60;
        let emptyEnterCount = 0;
        let wrongAttempts = 0;
        let isUnlimited = false;
        let currentMode = 'normal';
        let maxPlaySeconds = 5; 
        let startPlayTime = 0; 

        // DOM Elements
        const screens = document.querySelectorAll('.screen');
        const modeSelect = document.getElementById('modeSelect');
        const timeSelect = document.getElementById('timeSelect');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const audioPlayer = document.getElementById('audioPlayer');
        const sfxCorrect = document.getElementById('sfxCorrect');
        const sfxWrong = document.getElementById('sfxWrong');
        const answerInput = document.getElementById('answerInput');
        const hintBox = document.getElementById('hintBox');
        const toastMessage = document.getElementById('toastMessage');

        // 셔플 함수
        function shuffle(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 화면 전환
        function showScreen(screenId) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 토스트 메시지
        function showToast(msg, duration = 2000, callback = null) {
            toastMessage.textContent = msg;
            toastMessage.style.display = 'block';
            
            answerInput.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            setTimeout(() => {
                toastMessage.style.display = 'none';
                answerInput.disabled = false;
                document.getElementById('submitBtn').disabled = false;
                answerInput.focus();
                if (callback) callback();
            }, duration);
        }

        // 초성 추출 함수
        function getChosung(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
                else result += str.charAt(i); 
            }
            return result;
        }

        // 점수 업데이트
        function updateScoreDisplay() {
            if (isUnlimited) {
                scoreEl.textContent = `${score} / ${shuffledList.length}개`;
            } else {
                scoreEl.textContent = `${score}개`;
            }
        }

        // 게임 시작 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', () => {
            currentMode = modeSelect.value;
            const selectedTime = timeSelect.value;
            
            isUnlimited = (selectedTime === 'unlimited');
            totalTime = isUnlimited ? 0 : parseInt(selectedTime);
            timeLeft = totalTime;
            
            timerEl.style.color = "var(--text-main)";
            
            score = 0;
            currentIndex = 0;
            shuffledList = shuffle([...playlist]);
            updateScoreDisplay();
            
            if (isUnlimited) {
                timerEl.textContent = "무제한";
            } else {
                updateTimerDisplay();
                clearInterval(timer);
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) endGame();
                }, 1000);
            }
            
            showScreen('gameScreen');
            nextQuestion();
        });

        // 타이머 업데이트
        function updateTimerDisplay() {
            if (isUnlimited) return;
            
            if (totalTime > 0 && timeLeft <= (totalTime * 0.1)) {
                timerEl.style.color = "var(--danger)";
            } else {
                timerEl.style.color = "var(--text-main)";
            }

            const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const sec = String(timeLeft % 60).padStart(2, '0');
            timerEl.textContent = `${min}:${sec}`;
        }

        // 문제 로드
        function nextQuestion() {
            if (currentIndex >= shuffledList.length) {
                endGame();
                return;
            }
            hintBox.style.display = 'none';
            answerInput.value = '';
            answerInput.placeholder = '정답 입력 (빈칸 시 엔터 2번 = 패스)';
            emptyEnterCount = 0;
            wrongAttempts = 0; 
            
            const currentSong = shuffledList[currentIndex];
            audioPlayer.src = currentSong.src;
            audioPlayer.volume = document.getElementById('volumeSlider').value;
            
            audioPlayer.load();
            audioPlayer.onloadedmetadata = () => {
                playAudioLimit(5); 
            };
        }

        // 오디오 재생 제한
        function playAudioLimit(seconds) {
            maxPlaySeconds = seconds;
            
            if (currentMode === 'special' && audioPlayer.duration) {
                startPlayTime = audioPlayer.duration / 2;
            } else {
                startPlayTime = 0;
            }
            
            audioPlayer.currentTime = startPlayTime;
            audioPlayer.play().catch(e => console.log('자동 재생 제한'));
            document.getElementById('pauseBtn').textContent = '⏸️ 일시정지';
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.currentTime >= startPlayTime + maxPlaySeconds && !audioPlayer.paused) {
                audioPlayer.pause();
                document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (audioPlayer.paused) {
                playAudioLimit(5);
            } else {
                audioPlayer.pause();
                document.getElementById('pauseBtn').textContent = '▶️ 재생 (5초)';
            }
        });

        document.getElementById('play30Btn').addEventListener('click', () => {
            playAudioLimit(30);
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });

        document.getElementById('hintBtn').addEventListener('click', () => {
            const title = shuffledList[currentIndex].title;
            const chosung = getChosung(title);
            hintBox.textContent = `💡 힌트: [ ${chosung} ]`;
            hintBox.style.display = 'block';
        });

        // 정답 확인
        function checkAnswer() {
            const input = answerInput.value.trim();
            const currentTitle = shuffledList[currentIndex].title;
            
            if (!input) {
                emptyEnterCount++;
                if (emptyEnterCount >= 2) {
                    audioPlayer.pause();
                    showToast(`⏭️ 패스! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                        currentIndex++;
                        nextQuestion();
                    });
                } else {
                    answerInput.placeholder = '한 번 더 누르면 패스됩니다.';
                }
                return;
            }
            
            emptyEnterCount = 0;
            const cleanUser = input.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
            const cleanTarget = currentTitle.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
            
            if (cleanUser === cleanTarget) {
                audioPlayer.pause();
                sfxCorrect.currentTime = 0;
                sfxCorrect.play().catch(e=>{});
                
                score++;
                updateScoreDisplay();
                showToast("🎉 정답입니다!", 1200, () => {
                    currentIndex++;
                    nextQuestion();
                });
            } else {
                wrongAttempts++;
                sfxWrong.currentTime = 0;
                sfxWrong.play().catch(e=>{});
                
                answerInput.value = '';
                
                if (wrongAttempts >= 3) {
                    audioPlayer.pause();
                    showToast(`❌ 3회 오답! 정답은 [ ${currentTitle} ] 입니다.`, 2000, () => {
                        currentIndex++;
                        nextQuestion();
                    });
                } else {
                    answerInput.placeholder = `❌ 오답! (${3 - wrongAttempts}번의 기회 남음)`;
                }
            }
        }

        document.getElementById('submitBtn').addEventListener('click', checkAnswer);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        document.getElementById('exitGameBtn').addEventListener('click', () => {
            if (confirm("정말 게임을 종료하고 나가시겠습니까?")) {
                clearInterval(timer);
                audioPlayer.pause();
                showScreen('startScreen');
            }
        });

        function endGame() {
            clearInterval(timer);
            audioPlayer.pause();
            document.getElementById('finalScore').textContent = isUnlimited ? `${score} / ${shuffledList.length}개` : `${score}개`;
            showScreen('resultScreen');
        }

        // 랭킹 불러오기
        function loadRanking() {
            const rankList = document.getElementById('rankList');
            if (!rankList) return;

            if (!database) {
                rankList.innerHTML = '<li style="text-align:center; color:#ef4444; padding:20px;">⚠️ 파이어베이스 설정이 완료되지 않았습니다.<br><small style="color:#64748b;">(코드 내 firebaseConfig의 URL을 확인하세요)</small></li>';
                return;
            }

            rankList.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:20px;">데이터를 불러오는 중... ⏳</li>';
            
            database.ref('rankings').once('value', (snapshot) => {
                const ranks = [];
                snapshot.forEach((childSnapshot) => {
                    ranks.push(childSnapshot.val());
                });
                
                ranks.sort((a, b) => b.score - a.score);
                rankList.innerHTML = '';
                
                if (ranks.length === 0) {
                    rankList.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:20px;">아직 등록된 기록이 없습니다.</li>';
                    return;
                }
                
                ranks.slice(0, 50).forEach((r, idx) => {
                    const li = document.createElement('li');
                    li.style.cssText = "display:flex; justify-content:space-between; padding:8px 12px; border-bottom: 1px solid #e2e8f0;";
                    li.innerHTML = `
                        <span><strong>${idx + 1}위.</strong> ${r.name}</span>
                        <span style="color:var(--primary); font-weight:bold;">${r.score}개 <small style="color:#94a3b8; font-weight:normal;">(${r.mode})</small></span>
                    `;
                    rankList.appendChild(li);
                });
            }, (error) => {
                rankList.innerHTML = `<li style="text-align:center; color:#ef4444; padding:20px;">불러오기 실패: ${error.message}</li>`;
            });
        }

        // 랭킹 저장
        document.getElementById('saveRankBtn').addEventListener('click', () => {
            if (!database) {
                alert("파이어베이스 설정이 연결되지 않아 랭킹을 저장할 수 없습니다.");
                return;
            }

            const name = prompt("순위표에 등록할 닉네임을 입력하세요 (최대 8글자):");
            if (name && name.trim() !== '') {
                let modeText = isUnlimited ? '무제한' : `${totalTime}초`;
                if (currentMode === 'special') modeText += ' (Special)';
                
                database.ref('rankings').push({
                    name: name.trim().substring(0, 8),
                    score: score,
                    mode: modeText,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }, (error) => {
                    if (error) {
                        alert("저장 실패: " + error.message);
                    } else {
                        alert("🎉 랭킹에 등록되었습니다!");
                        document.getElementById('saveRankBtn').style.display = 'none';
                        loadRanking();
                    }
                });
            }
        });

        // 기타 버튼 연결
        document.getElementById('restartBtn').addEventListener('click', () => showScreen('startScreen'));
        document.getElementById('viewRankBtn').addEventListener('click', () => {
            loadRanking();
            showScreen('rankScreen');
        });
        document.getElementById('backToStartBtn').addEventListener('click', () => showScreen('startScreen'));
    </script>
