<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 섭리 명곡 맞추기</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* 시작 화면 */
        .start-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
        }

        select {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
        }

        /* 게임 화면 */
        .status-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-item .label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .status-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .player-card {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-sub);
            font-size: 14px;
        }

        input[type="range"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .hint-box {
            background: #fef3c7;
            color: #92400e;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .notice {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        /* 결과 화면 */
        .result-card {
            text-align: center;
            padding: 20px 0;
        }

        .result-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .tier-badge {
            font-size: 22px;
            font-weight: 700;
            padding: 8px 16px;
            background: #f1f5f9;
            border-radius: 50px;
            display: inline-block;
            margin: 12px 0;
            color: var(--primary);
        }

        .score-display {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .result-ment {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 24px;
        }

        /* 공통 버튼 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-full { width: 100%; padding: 16px; font-size: 16px; }
        .btn-sub { background: #e2e8f0; color: var(--text-main); }
        .btn-sub:hover { background: #cbd5e1; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { filter: brightness(0.9); }

        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎵 섭리 명곡 맞추기</h1>
    </div>

    <!-- 1. 게임 시작 화면 -->
    <div id="startScreen" class="screen active">
        <div class="start-group">
            <div class="select-wrapper">
                <span>제한 시간 설정</span>
                <select id="timeSelect">
                    <option value="60">1분</option>
                    <option value="120">2분</option>
                    <option value="180">3분</option>
                </select>
            </div>
            <button class="btn btn-full" id="startBtn">🎮 게임 시작</button>
        </div>
    </div>

    <!-- 2. 게임 진행 화면 -->
    <div id="gameScreen" class="screen">
        <div class="status-board">
            <div class="status-item">
                <span class="label">⏱️ 남은 시간</span>
                <span class="value" id="timer">01:00</span>
            </div>
            <div class="status-item">
                <span class="label">🎯 맞춘 개수</span>
                <span class="value" id="score">0개</span>
            </div>
        </div>

        <div class="player-card">
            <div class="controls-row">
                <button class="btn btn-sub" id="pauseBtn">⏸️ 일시정지</button>
                <button class="btn" id="play30Btn">▶️ 30초 듣기</button>
            </div>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 16px;">
            <button class="btn btn-warning" id="hintBtn">💡 힌트 보기</button>
        </div>
        <div class="hint-box" id="hintBox"></div>

        <div class="input-group">
            <input type="text" id="answerInput" placeholder="정답 입력 (빈칸 시 엔터 2번 = 패스)" autocomplete="off">
            <button class="btn" id="submitBtn">확인</button>
        </div>
        <p class="notice">* 띄어쓰기는 틀려도 글자만 맞으면 정답 처리됩니다.</p>
        
        <audio id="audioPlayer"></audio>
    </div>

    <!-- 3. 게임 종료 화면 -->
    <div id="resultScreen" class="screen">
        <div class="result-card">
            <div class="result-title">게임 종료!</div>
            <div class="score-display" id="finalScore">0개</div>
            <div class="tier-badge" id="tierBadge">🥉 브론즈</div>
            <p class="result-ment" id="resultMent">조금 더 도전해보세요!</p>
            <button class="btn btn-full" id="restartBtn">🔄 다시 하기</button>
        </div>
    </div>
</div>

<script>
// Part 1 & Part 5 곡 목록 데이터
const playlist = [
  // --- PART 1 ---
  { title: "My Way remix", src: "part1/My Way remix.mp3" },

  { title: "가자 때가 됐다 remix", src: "part1/가자 때가 됐다 remix.mp3" },
  { title: "가자 때가 됐다", src: "part1/가자 때가 됐다.mp3" },
  { title: "가자 별봉정으로", src: "part1/가자 별봉정으로.mp3" },
  { title: "가자 오자 대둔산으로", src: "part1/가자 오자 대둔산으로.mp3" },
  { title: "감동되었네 감화되었네", src: "part1/감동되었네 감화되었네.mp3" },
  { title: "걱정 말고 따라오너라", src: "part1/걱정 말고 따라오너라.mp3" },
  { title: "걸작은 연출", src: "part1/걸작은 연출.mp3" },
  { title: "고향 산 너머", src: "part1/고향 산 너머.mp3" },
  { title: "골든 타임 놓치지 말아라", src: "part1/골든 타임 놓치지 말아라.mp3" },
  { title: "골인이다", src: "part1/골인이다.mp3" },
  { title: "광명한 새벽별아", src: "part1/광명한 새벽별아.mp3" },
  { title: "구상대로 행한다면", src: "part1/구상대로 행한다면.mp3" },
  { title: "구상을 주셨네", src: "part1/구상을 주셨네.mp3" },
  { title: "굳건히 가야 한다", src: "part1/굳건히 가야 한다.mp3" },
  { title: "굳건히 서서", src: "part1/굳건히 서서.mp3" },
  { title: "귀하게 써야 한다", src: "part1/귀하게 써야 한다.mp3" },
  { title: "그대 통하여 하나님 삶을", src: "part1/그대 통하여 하나님 삶을.mp3" },
  { title: "그때가 되면", src: "part1/그때가 되면.mp3" },
  { title: "극히 담대하라", src: "part1/극히 담대하라.mp3" },
  { title: "기다려요", src: "part1/기다려요.mp3" },
  { title: "기다렸지 긴긴 날을", src: "part1/기다렸지 긴긴 날을.mp3" },
  { title: "기도다 기도", src: "part1/기도다 기도.mp3" },
  { title: "기도동산아", src: "part1/기도동산아.mp3" },
  { title: "기도동산이어라", src: "part1/기도동산이어라.mp3" },
  { title: "기도를 못 했잖아요", src: "part1/기도를 못 했잖아요.mp3" },
  { title: "기도의 님아", src: "part1/기도의 님아.mp3" },
  { title: "기도하고 또 기도하라", src: "part1/기도하고 또 기도하라.mp3" },
  { title: "기도합니다", src: "part1/기도합니다.mp3" },
  { title: "기적의 날씨", src: "part1/기적의 날씨.mp3" },
  { title: "기적의 역사다", src: "part1/기적의 역사다.mp3" },
  { title: "길 잃은 사람, 길 찾은 사람", src: "part1/길 잃은 사람, 길 찾은 사람.mp3" },
  { title: "깊어 가는 여름밤", src: "part1/깊어 가는 여름밤.mp3" },
  { title: "깨끗한 계곡에서", src: "part1/깨끗한 계곡에서.mp3" },
  { title: "깨닫도록 하였다", src: "part1/깨닫도록 하였다.mp3" },
  { title: "깨달아라", src: "part1/깨달아라.mp3" },

  // --- PART 5 ---
  { title: "추부 IC", src: "part5/추부 IC.mp3" },
  { title: "큰 사람", src: "part5/큰 사람.mp3" },
  { title: "평화와 영광", src: "part5/평화와 영광.mp3" },
  { title: "푸른 하늘 별처럼", src: "part5/푸른 하늘 별처럼.mp3" },
  { title: "하나님 궁, 계절마다 아름답다", src: "part5/하나님 궁, 계절마다 아름답다.mp3" },
  { title: "하나님 궁전", src: "part5/하나님 궁전.mp3" },
  { title: "하나님 뜻을 향해 가는 사람", src: "part5/하나님 뜻을 향해 가는 사람.mp3" },
  { title: "하나님 마음에 드는 삶", src: "part5/하나님 마음에 드는 삶.mp3" },
  { title: "하나님 말씀대로 살았네", src: "part5/하나님 말씀대로 살았네.mp3" },
  { title: "하나님 몸이 되어서", src: "part5/하나님 몸이 되어서.mp3" },
  { title: "하나님의 약속", src: "part5/하나님의 약속.mp3" },
  { title: "하늘의 능력을 날마다 보며", src: "part5/하늘의 능력을 날마다 보며.mp3" },
  { title: "하면 되는 거야", src: "part5/하면 되는 거야.mp3" },
  { title: "한 알의 밀알로", src: "part5/한 알의 밀알로.mp3" },
  { title: "할 때 해야 된다", src: "part5/할 때 해야 된다.mp3" },
  { title: "행하고 달려라", src: "part5/행하고 달려라.mp3" },
  { title: "형통의 길", src: "part5/형통의 길.mp3" },
  { title: "황금천국 삶", src: "part5/황금천국 삶.mp3" },
  { title: "휴거는 사랑이다", src: "part5/휴거는 사랑이다.mp3" }
];

// 변수 설정
let shuffledList = [];
let currentIndex = 0;
let score = 0;
let timer = null;
let timeLeft = 60;
let emptyEnterCount = 0;

// Element 로드
const startScreen = document.getElementById('startScreen');
const gameScreen = document.getElementById('gameScreen');
const resultScreen = document.getElementById('resultScreen');

const timeSelect = document.getElementById('timeSelect');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const audioPlayer = document.getElementById('audioPlayer');
const pauseBtn = document.getElementById('pauseBtn');
const play30Btn = document.getElementById('play30Btn');
const volumeSlider = document.getElementById('volumeSlider');

const hintBtn = document.getElementById('hintBtn');
const hintBox = document.getElementById('hintBox');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');

const finalScore = document.getElementById('finalScore');
const tierBadge = document.getElementById('tierBadge');
const resultMent = document.getElementById('resultMent');

// 셔플 함수
function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

// 화면 전환
function showScreen(screen) {
    [startScreen, gameScreen, resultScreen].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
}

// 게임 시작
startBtn.addEventListener('click', () => {
    timeLeft = parseInt(timeSelect.value);
    score = 0;
    currentIndex = 0;
    shuffledList = shuffle([...playlist]);
    
    scoreEl.textContent = `${score}개`;
    updateTimerDisplay();
    
    showScreen(gameScreen);
    nextQuestion();
    
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
            endGame();
        }
    }, 1000);
});

function updateTimerDisplay() {
    const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const sec = String(timeLeft % 60).padStart(2, '0');
    timerEl.textContent = `${min}:${sec}`;
}

// 다음 문제 로드
function nextQuestion() {
    if (currentIndex >= shuffledList.length) {
        endGame();
        return;
    }
    
    hintBox.style.display = 'none';
    answerInput.value = '';
    emptyEnterCount = 0;
    
    const currentSong = shuffledList[currentIndex];
    audioPlayer.src = currentSong.src;
    audioPlayer.volume = volumeSlider.value;
    audioPlayer.play().catch(e => console.log('Auto play blocked'));
}

// 오디오 제어
pauseBtn.addEventListener('click', () => {
    if (audioPlayer.paused) {
        audioPlayer.play();
        pauseBtn.textContent = '⏸️ 일시정지';
    } else {
        audioPlayer.pause();
        pauseBtn.textContent = '▶️ 재생';
    }
});

play30Btn.addEventListener('click', () => {
    audioPlayer.currentTime = 0;
    audioPlayer.play();
    setTimeout(() => {
        audioPlayer.pause();
    }, 30000);
});

volumeSlider.addEventListener('input', (e) => {
    audioPlayer.volume = e.target.value;
});

// 힌트 보기
hintBtn.addEventListener('click', () => {
    const title = shuffledList[currentIndex].title;
    hintBox.textContent = `💡 힌트: 글자 수 [${title.length}글자] / 첫 글자 [${title[0]}]`;
    hintBox.style.display = 'block';
});

// 정답 확인
function checkAnswer() {
    const input = answerInput.value.trim();
    
    // 빈칸 엔터 2번 시 패스 처리
    if (!input) {
        emptyEnterCount++;
        if (emptyEnterCount >= 2) {
            currentIndex++;
            nextQuestion();
        }
        return;
    }
    
    emptyEnterCount = 0;
    const cleanUser = input.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
    const cleanTarget = shuffledList[currentIndex].title.replace(/[\s\?\!\.\,\~\(\)\-_]/g, "").toLowerCase();
    
    if (cleanUser === cleanTarget) {
        score++;
        scoreEl.textContent = `${score}개`;
        currentIndex++;
        nextQuestion();
    } else {
        answerInput.value = '';
        answerInput.placeholder = '❌ 틀렸습니다! 다시 입력하세요';
        setTimeout(() => {
            answerInput.placeholder = '정답 입력 (빈칸 시 엔터 2번 = 패스)';
        }, 1200);
    }
}

submitBtn.addEventListener('click', checkAnswer);
answerInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkAnswer();
});

// 게임 종료
function endGame() {
    clearInterval(timer);
    audioPlayer.pause();
    
    finalScore.textContent = `${score}개`;
    
    // 티어 판정
    if (score >= 15) {
        tierBadge.textContent = '👑 마스터';
        resultMent.textContent = '엄청난 실력이시네요! 섭리 명곡 완벽 마스터!';
    } else if (score >= 10) {
        tierBadge.textContent = '🥇 골드';
        resultMent.textContent = '대단합니다! 상당한 내공의 소유자시군요!';
    } else if (score >= 5) {
        tierBadge.textContent = '🥈 실버';
        resultMent.textContent = '좋은 성적입니다! 조금만 더 하면 골드 달성!';
    } else {
        tierBadge.textContent = '🥉 브론즈';
        resultMent.textContent = '더 연습해서 다시 도전해보세요!';
    }
    
    showScreen(resultScreen);
}

restartBtn.addEventListener('click', () => {
    showScreen(startScreen);
});
</script>

</body>
</html>
